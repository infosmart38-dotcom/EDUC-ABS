function classForm(id) {
  const c = id ? Store.get('classes', id) : null, levels = Store.sortedLevels();
  if (!levels.length) return Toast.show(t('err_no_levels'), 'error');
  Modal.open({
    title: c ? t('edit_class') : t('add_class'),
    body: `<div class="form-error" hidden></div><div class="form-grid">
      <label class="fld"><span>${t('class_name')} *</span><input id="cl_name" value="${esc(c ? c.name : '')}" autocomplete="off"></label>
      <label class="fld"><span>${t('level')} *</span><select id="cl_level">${levels.map(l => `<option value="${esc(l.id)}" ${c && c.levelId === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label></div>`,
    buttons: [{ label: t('cancel') }, {
      label: t('save'), cls: 'primary', onClick: ov => {
        const name = $('#cl_name', ov).value.trim().replace(/\s+/g, ' '), levelId = $('#cl_level', ov).value;
        if (!name) return Modal.error(ov, t('err_name_required'));
        if (Store.list('classes').some(x => x.id !== (c && c.id) && norm(x.name) === norm(name))) return Modal.error(ov, t('err_class_exists'));
        if (c) {
          Store.update('classes', c.id, { name, levelId });
          Store.list('students').forEach(s => { if (s.classId === c.id) s.levelId = levelId; });
        } else {
          const order = Store.list('classes').filter(x => x.levelId === levelId).reduce((m, x) => Math.max(m, x.order || 0), 0) + 1;
          Store.add('classes', { id: uid('c'), name, levelId, order });
        }
        Toast.show(t('saved'), 'success'); App.refresh();
      }
    }]
  });
}
ACT.clAdd = () => classForm(null);
ACT.clEdit = el => classForm(el.dataset.id);
ACT.clDel = async el => {
  const c = Store.get('classes', el.dataset.id); if (!c) return;
  const n = Store.list('students').filter(s => s.classId === c.id).length;
  if (n) return Toast.show(t('err_class_has_students', { n }), 'error', 6000);
  if (!await Modal.confirm(t('confirm_delete_class', { name: c.name }), { danger: true, okLabel: t('delete') })) return;
  Store.remove('classes', c.id);
  Store.list('users').forEach(u => { if (u.classIds) u.classIds = u.classIds.filter(x => x !== c.id); });
  Store.touch(); Toast.show(t('deleted'), 'success'); App.refresh();
};

/* توليد الأقسام تلقائياً: مثال 1AM1 … 1AM4 */
ACT.clGen = () => {
  const levels = Store.sortedLevels();
  if (!levels.length) return Toast.show(t('err_no_levels'), 'error');
  Modal.open({
    title: t('auto_generate'),
    body: `<p class="muted">${t('gen_hint')}</p><div class="table-wrap"><table class="tbl compact"><thead><tr><th>${t('level')}</th><th>${t('existing')}</th><th>${t('target_count')}</th></tr></thead><tbody>${levels.map(l => {
      const ex = Store.sortedClasses(l.id).length;
      return `<tr><td>${esc(l.name)} <small class="muted">(${esc(l.short)}…)</small></td><td>${ex}</td><td><input type="number" min="0" max="30" class="gen-n" data-lv="${esc(l.id)}" value="${Math.max(ex, 4)}" style="width:5em"></td></tr>`;
    }).join('')}</tbody></table></div>`,
    buttons: [{ label: t('cancel') }, {
      label: t('generate'), cls: 'primary', onClick: ov => {
        let added = 0;
        $$('.gen-n', ov).forEach(inp => {
          const l = Store.get('levels', inp.dataset.lv), n = Math.min(30, Math.max(0, parseInt(inp.value, 10) || 0));
          const names = new Set(Store.list('classes').map(c => norm(c.name)));
          for (let i = 1; i <= n; i++) {
            const name = (l.short || l.name) + i;
            if (!names.has(norm(name))) { Store.list('classes').push({ id: uid('c'), name, levelId: l.id, order: i }); names.add(norm(name)); added++; }
          }
        });
        Store.touch(); Toast.show(t('generated', { n: added }), 'success'); App.refresh();
      }
    }]
  });
};

/* إدارة المستويات */
ACT.clLevels = () => {
  const row = l => `<tr data-id="${esc(l ? l.id : '')}">
    <td><input class="lv-name" value="${esc(l ? l.name : '')}"></td><td><input class="lv-short" value="${esc(l ? l.short : '')}" style="width:6em"></td>
    <td><input class="lv-order" type="number" value="${l ? l.order : ''}" style="width:5em"></td>
    <td class="num">${l ? Store.sortedClasses(l.id).length : 0}</td>
    <td><button type="button" class="icon-btn danger" data-lvdel aria-label="${esc(t('delete'))}">${icon('trash')}</button></td></tr>`;
  Modal.open({
    title: t('manage_levels'), wide: true,
    body: `<div class="form-error" hidden></div><div class="table-wrap"><table class="tbl compact"><thead><tr><th>${t('level_name')}</th><th>${t('level_short')}</th><th>${t('order')}</th><th>${t('nav_classes')}</th><th></th></tr></thead><tbody id="lvBody">${Store.sortedLevels().map(row).join('')}</tbody></table></div>
      <div class="btn-row"><button type="button" class="btn" id="lvAdd">${icon('plus')} ${t('add_level')}</button></div>`,
    onMount: ov => {
      $('#lvAdd', ov).addEventListener('click', () => {
        const next = $$('#lvBody tr', ov).reduce((m, r) => Math.max(m, parseInt($('.lv-order', r).value, 10) || 0), 0) + 1;
        const tmp = document.createElement('tbody'); tmp.innerHTML = row(null);
        const tr = tmp.firstElementChild; $('.lv-order', tr).value = next; $('#lvBody', ov).appendChild(tr); $('.lv-name', tr).focus();
      });
      $('#lvBody', ov).addEventListener('click', e => {
        const b = e.target.closest('[data-lvdel]'); if (!b) return;
        const tr = b.closest('tr'), id = tr.dataset.id;
        if (id && Store.sortedClasses(id).length) return Modal.error(ov, t('err_level_has_classes'));
        if (id) { tr.dataset.del = '1'; tr.hidden = true; } else tr.remove();
      });
    },
    buttons: [{ label: t('cancel') }, {
      label: t('save'), cls: 'primary', onClick: ov => {
        const rows = $$('#lvBody tr', ov).filter(r => !r.dataset.del);
        for (const r of rows) if (!$('.lv-name', r).value.trim()) return Modal.error(ov, t('err_name_required'));
        $$('#lvBody tr[data-del]', ov).forEach(r => Store.remove('levels', r.dataset.id));
        rows.forEach(r => {
          const name = $('.lv-name', r).value.trim(), short = $('.lv-short', r).value.trim() || name, order = parseInt($('.lv-order', r).value, 10) || 0;
          if (r.dataset.id) Store.update('levels', r.dataset.id, { name, short, order });
          else Store.add('levels', { id: uid('lv'), name, short, order });
        });
        Store.touch(); Toast.show(t('saved'), 'success'); App.refresh();
      }
    }]
  });
};

const CF = { id: '', tab: 'students', q: '', page: 1 };

function classPicker(selected) {
  const html = Store.sortedLevels().map(l => {
    const cs = Store.sortedClasses(l.id); if (!cs.length) return '';
    return `<div class="pick-level"><label class="chk strong"><input type="checkbox" data-lvl="${esc(l.id)}"> ${esc(l.name)}</label>
      <div class="pick-classes">${cs.map(c => `<label class="chk"><input type="checkbox" class="pick-cls" data-level="${esc(l.id)}" value="${esc(c.id)}" ${selected.includes(c.id) ? 'checked' : ''}> ${esc(c.name)}</label>`).join('')}</div></div>`;
  }).join('');
  return html || `<p class="muted">${t('no_classes')}</p>`;
}
function syncPicker(root) {
  $$('[data-lvl]', root).forEach(cb => {
    const boxes = $$('.pick-cls[data-level="' + cb.dataset.lvl + '"]', root), n = boxes.filter(b => b.checked).length;
    cb.checked = n === boxes.length && n > 0; cb.indeterminate = n > 0 && n < boxes.length;
  });
}

function supervisorForm(id) {
  const u = id ? Store.get('users', id) : null;
  const ov = Modal.open({
    title: u ? t('edit_supervisor') : t('add_supervisor'), wide: true,
    body: `<div class="form-error" hidden></div><div class="form-grid">
      <label class="fld"><span>${t('full_name')} *</span><input id="su_name" value="${esc(u ? u.fullName : '')}" autocomplete="off"></label>

      <label class="chk full"><input type="checkbox" id="su_active" ${!u || u.active !== false ? 'checked' : ''}> ${t('account_active')}</label></div>
      <h4>${t('assigned_classes')}</h4><div class="picker" id="su_picker">${classPicker(u ? u.classIds || [] : [])}</div>`,
    onMount: ov => {

      $('#su_picker', ov).addEventListener('change', e => {
        const lv = e.target.closest('[data-lvl]');
        if (lv) $$('.pick-cls[data-level="' + lv.dataset.lvl + '"]', ov).forEach(b => b.checked = lv.checked);
        syncPicker(ov);
      });
    },
    buttons: [{ label: t('cancel') }, {
      label: t('save'), cls: 'primary', onClick: async ov => {
        const fullName = $('#su_name', ov).value.trim(), username = $('#su_user', ov).value.trim(), pass = $('#su_pass', ov).value;
        if (!fullName || username.length < 3) return Modal.error(ov, t('err_sup_fields'));

        if (Store.list('users').some(x => x.id !== (u && u.id) && x.username.toLowerCase() === username.toLowerCase())) return Modal.error(ov, t('err_username_exists'));
        if (!u && pass.length < 4) return Modal.error(ov, t('err_password_short'));

        const rec = { fullName, username, phone: $('#su_phone', ov).value.trim(), active: $('#su_active', ov).checked, classIds: $$('.pick-cls:checked', ov).map(b => b.value) };

        Toast.show(t('saved'), 'success'); App.refresh();
      }
    }]

  return ov;
}

const Net = {
  base(v) { v = String(v || '').trim().replace(/\/+$/, ''); if (!v) return ''; return /^https?:\/\//i.test(v) ? v : 'http://' + v; },
  async call(base, pin, method, body) {
    let r;
    try { r = await fetch(base + '/api/backup', { method, headers: { 'Content-Type': 'application/json', 'x-sync-pin': pin }, body }); }
    catch (e) { throw new Error(t('err_peer_unreachable')); }
    if (r.status === 401) throw new Error(t('err_pin'));
    if (r.status === 404) throw new Error(t('err_peer_empty'));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  },
  async send(base, pin) { return this.call(base, pin, 'POST', await Store.exportJSON()); },
  async fetchCopy(base, pin) { return (await this.call(base, pin, 'GET')).json(); }
};
function peerValues() {
  const base = Net.base($('#lanUrl').value), pin = $('#lanPin').value.trim();
  if (!base) { Toast.show(t('err_peer_url'), 'error'); return null; }
  try { localStorage.setItem('att_peer', base); } catch (e) { /* ignore */ }
  return { base, pin };
}
function fileToLogo(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 240 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

/* ---- 10-page-attendance.js ---- */
'use strict';
/* =====================================================================
   10-page-attendance.js — جرد الحضور بالماسح QR (كاميرا / ماسح USB / إدخال يدوي)
   + رموز QR للتلاميذ: عرض، طباعة بطاقات، استبدال الرمز
   ===================================================================== */

/* ---------- الأصوات: نجاح / تنبيه تكرار / خطأ ---------- */
const Sound = {
  ctx: null, on: true, history: [],
  init() { try { this.on = localStorage.getItem('att_sound') !== '0'; } catch (e) { /* ignore */ } },
  set(v) { this.on = !!v; try { localStorage.setItem('att_sound', v ? '1' : '0'); } catch (e) { /* ignore */ } },
  unlock() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* ignore */ }
  },
  tone(freq, start, dur, type = 'sine', vol = 0.28) {
    if (!this.on || !this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t0 = this.ctx.currentTime + start;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  },
  vib(p) { if (this.on && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) { /* ignore */ } } },
  log(n) { this.history.push(n); if (this.history.length > 30) this.history.shift(); },
  ok() { this.log('ok'); this.tone(1175, 0, 0.09); this.tone(1568, 0.09, 0.14); this.vib(60); },
  warn() { this.log('warn'); this.tone(698, 0, 0.12, 'triangle'); this.tone(698, 0.18, 0.12, 'triangle'); this.vib([40, 60, 40]); },
  err() { this.log('err'); this.tone(170, 0, 0.4, 'sawtooth', 0.32); this.vib([140, 70, 140]); }
};
Sound.init();

/* ---------- منطق التسجيل (بلا واجهة) ---------- */
const Attendance = {
  state: null,
  init() { if (!this.state) this.state = { date: todayISO(), stamp: todayISO(), session: this.autoSession(), type: 'in', classId: '' }; return this.state; },
  autoSession() {
    const [h, m] = (Store.data.settings.afternoonStart || '13:00').split(':').map(Number), d = new Date();
    return d.getHours() * 60 + d.getMinutes() >= h * 60 + m - 90 ? 'PM' : 'AM';
  },
  lateInfo(session, now) {
    const s = Store.data.settings, [h, m] = ((session === 'AM' ? s.morningStart : s.afternoonStart) || '08:00').split(':').map(Number);
    const diff = now.getHours() * 60 + now.getMinutes() - (h * 60 + m), grace = Math.max(0, +s.graceMinutes || 0);
    return diff > grace ? { late: true, minutes: diff } : { late: false, minutes: 0 };
  },
  timeOf(rec) { const d = new Date(rec.ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); },

  async record(student, { source = 'qr', date, session, type } = {}) {
    const st = this.init(); date = date || st.date; session = session || st.session; type = type || st.type;
    await Att.ensure(date.slice(0, 7));
    const exist = Att.find(student.id, date, session, type);
    if (exist) return { kind: 'dup', student, rec: exist };
    const now = new Date(), today = date === todayISO();
    const ts = today ? now.toISOString() : new Date(date + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds())).toISOString();
    let status = 'present', lateMin = 0;
    if (type === 'in' && today) { const li = this.lateInfo(session, now); if (li.late) { status = 'late'; lateMin = li.minutes; } }
    const rec = { studentId: student.id, classId: student.classId || '', date, session, type, ts, status, lateMin, source, by: Auth.uid };
    Att.add(rec);
    return { kind: 'ok', student, rec };
  },
  async scan(raw, source = 'qr') {
    const s = Store.studentByScan(raw);
    if (!s) return { kind: 'unknown', raw: String(raw || '').slice(0, 40) };
    if (!Auth.canStudent(s)) return { kind: 'forbidden', student: s };
    if (s.status !== 'active') return { kind: 'inactive', student: s };
    return this.record(s, { source });
  }
};

/* ---------- الكاميرا ---------- */
const Scanner = {
  stream: null, running: false, timer: null, detector: null, canvas: null, facing: 'environment',
  lastText: '', lastAt: 0, failSince: 0, lastFailAt: 0, onText: null, onUnreadable: null, video: null,
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false; },
  async start(video) {
    this.stop(); this.video = video;
    this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: this.facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = this.stream; await video.play();
    this.running = true; this.loop();
  },
  stop() {
    this.running = false; clearTimeout(this.timer);
    if (this.stream) this.stream.getTracks().forEach(tr => tr.stop());
    this.stream = null; if (this.video) { try { this.video.srcObject = null; } catch (e) { /* ignore */ } }
  },
  async loop() {
    if (!this.running) return;
    const v = this.video;
    try {
      if (v && v.readyState >= 2 && v.videoWidth) {
        const text = await this.readFrame(v);
        if (text && this.running) {
          const now = Date.now();
          if (text !== this.lastText || now - this.lastAt > 4000) { this.lastText = text; this.lastAt = now; if (this.onText) this.onText(text); }
          else this.lastAt = now;                                   // نفس البطاقة ما زالت أمام الكاميرا: لا تكرار
        }
      }
    } catch (e) { /* إطار تالف */ }
    if (this.running) this.timer = setTimeout(() => this.loop(), 90);
  },
  async readFrame(v) {
    if ('BarcodeDetector' in window && this.detector !== false) {
      try {
        if (!this.detector) { const f = await BarcodeDetector.getSupportedFormats(); this.detector = f.includes('qr_code') ? new BarcodeDetector({ formats: ['qr_code'] }) : false; }
        if (this.detector) { const r = await this.detector.detect(v); return r.length ? r[0].rawValue : null; }
      } catch (e) { this.detector = false; }
    }
    const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
    if (!this.canvas) this.canvas = document.createElement('canvas');
    if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
    const cx = this.canvas.getContext('2d', { willReadFrequently: true }); cx.drawImage(v, 0, 0, w, h);
    const r = QR.decode(cx.getImageData(0, 0, w, h));
    if (r.text) { this.failSince = 0; return r.text; }
    if (r.found) {                                                  // رمز ظاهر لكن غير مقروء: نبّه بعد ثانيتين
      const now = Date.now();
      if (!this.failSince) this.failSince = now;
      else if (now - this.failSince > 2000 && now - this.lastFailAt > 4000) { this.lastFailAt = now; this.failSince = 0; if (this.onUnreadable) this.onUnreadable(); }
    } else this.failSince = 0;
    return null;
  }
};

/* ---------- صفحة الحضور ---------- */
const seg = (act, items, cur) => items.map(([v, label]) => `<button type="button" class="seg-btn ${v === cur ? 'active' : ''}" data-act="${act}" data-v="${v}" aria-pressed="${v === cur}">${esc(label)}</button>`).join('');
let afResultTimer = null;

Pages.attendance = {

            <div class="af-idle" id="afIdle">${icon('camera')}<span>${Scanner.supported() ? t('camera_off') : t('camera_unavailable')}</span></div></div>
          <div class="btn-row"><button class="btn primary" data-act="afCam" id="afCamBtn">${icon('camera')} <span>${t('camera_start')}</span></button>
            <button class="btn" data-act="afSwitch" id="afSwitch" hidden>${icon('refresh')} <span>${t('camera_switch')}</span></button></div>
          ${Scanner.supported() ? '' : `<p class="muted small">${t('camera_err_secure')}</p>`}

        </div>

        <div id="afSummary"></div></div>`;
  },
  async mount() {

    Scanner.onText = txt => AF.handle(txt, 'qr');

    AF.showResult({ kind: 'idle' }, true);

    AF.updateAll();
    if (!matchMedia('(pointer: coarse)').matches) { const i = $('#afInput'); if (i) i.focus(); }
  },
  unmount() { Scanner.stop(); document.removeEventListener('keydown', AF.keyCapture); clearTimeout(afResultTimer); }
};

const AF = {
  /* الماسحات USB تكتب كلوحة مفاتيح: إن لم يكن حقل مفتوحاً نوجّه الأحرف إلى حقل الرمز */
  keyCapture(e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA')) return;
    if (Modal.stack.length) return;
    const i = $('#afInput'); if (i) i.focus();
  },

  async handle(raw, source) {
    Sound.unlock();
    const text = String(raw || '').trim(); if (!text) return null;
    let res;
    try { res = await Attendance.scan(text, source); } catch (e) { console.error(e); res = { kind: 'error', message: String(e.message || e) }; }
    this.showResult(res); this.updateRecent(); this.updateSummary();
    return res;
  },

  showResult(res, silent) {
    const box = $('#afResult'); if (!box) return;
    clearTimeout(afResultTimer);
    const name = s => esc(s.lastName + ' ' + s.firstName), cls = s => esc(Store.className(s.classId) || '—');
    const st = Attendance.state;
    let state = 'idle', html = '';
    const typeLabel = () => t(st.type === 'in' ? 'type_in' : 'type_out') + ' · ' + t(st.session === 'AM' ? 'session_am' : 'session_pm');
    switch (res.kind) {
      case 'ok': {
        const late = res.rec.status === 'late';
        state = late ? 'late' : 'ok'; if (!silent) Sound.ok();
        html = `<div class="ar-ic">${icon('check')}</div><div><b class="ar-name">${name(res.student)}</b><div>${cls(res.student)} · ${typeLabel()} · <b>${Attendance.timeOf(res.rec)}</b></div>${late ? `<span class="chip warn">${t('late_by', { m: res.rec.lateMin })}</span>` : ''}</div>`; break;
      }
      case 'dup':
        state = 'warn'; if (!silent) Sound.warn();
        html = `<div class="ar-ic">${icon('alert')}</div><div><b class="ar-name">${name(res.student)}</b><div>${cls(res.student)}</div><div>${t('scan_dup', { time: Attendance.timeOf(res.rec) })}</div></div>`; break;
      case 'forbidden':
        state = 'err'; if (!silent) Sound.err();
        html = `<div class="ar-ic">${icon('alert')}</div><div><b class="ar-name">${name(res.student)}</b><div>${t('scan_forbidden')}</div></div>`; break;
      case 'inactive':
        state = 'err'; if (!silent) Sound.err();
        html = `<div class="ar-ic">${icon('alert')}</div><div><b class="ar-name">${name(res.student)}</b><div>${t('scan_inactive', { status: esc(t('st_' + res.student.status)) })}</div></div>`; break;
      case 'unknown':
        state = 'err'; if (!silent) Sound.err();
        html = `<div class="ar-ic">${icon('alert')}</div><div><b class="ar-name">${t('scan_unknown')}</b><div class="muted small" dir="ltr">${esc(res.raw)}</div></div>`; break;
      case 'unreadable':
        state = 'err'; if (!silent) Sound.err();
        html = `<div class="ar-ic">${icon('alert')}</div><div><b class="ar-name">${t('scan_unreadable')}</b></div>`; break;
      case 'error':
        state = 'err'; if (!silent) Sound.err();
        html = `<div class="ar-ic">${icon('alert')}</div><div><b class="ar-name">${esc(res.message)}</b></div>`; break;
      default:
        html = `<div class="ar-ic">${icon('scan')}</div><div><b class="ar-name">${t('ready_to_scan')}</b><div class="muted">${typeLabel()}</div></div>`;
    }
    box.className = 'card af-result ' + state; box.innerHTML = html;
    if (state !== 'idle') afResultTimer = setTimeout(() => this.showResult({ kind: 'idle' }, true), 6000);
  },

  recs() {
    const st = Attendance.state;
    return Att.day(st.date).filter(r => r.session === st.session && r.type === st.type);
  },
  updateAll() { this.updateWarn(); this.updateRecent(); this.updateSummary(); },
  updateWarn() {
    const el = $('#afWarn'); if (!el) return;
    el.innerHTML = Attendance.state.date !== todayISO() ? `<div class="alert warn">${icon('alert')}<div>${t('date_not_today')}</div></div>` : '';
  },
  updateRecent() {
    const box = $('#afRecent'); if (!box) return;
    const rows = this.recs().slice().sort((a, b) => (a.ts < b.ts ? 1 : -1)).map(r => ({ r, s: Store.get('students', r.studentId) })).filter(x => x.s && Auth.canStudent(x.s)).slice(0, 15);
    box.innerHTML = rows.length ? `<ul class="af-list">${rows.map(({ r, s }) => `<li><span class="af-time">${Attendance.timeOf(r)}</span>
      <span class="af-n">${esc(s.lastName + ' ' + s.firstName)}<small class="muted"> ${esc(Store.className(s.classId))}</small></span>
      ${r.status === 'late' ? `<span class="chip warn">${t('late_by', { m: r.lateMin })}</span>` : ''}
      <button class="icon-btn danger" data-act="afDel" data-key="${esc(Att.key(r))}" title="${esc(t('unmark'))}" aria-label="${esc(t('unmark'))}">${icon('trash')}</button></li>`).join('')}</ul>`
      : `<p class="muted">${t('no_scans')}</p>`;
  },
  updateSummary() {
    const box = $('#afSummary'); if (!box) return;
    const st = Attendance.state, students = Auth.students().filter(s => s.status === 'active' && (!st.classId || s.classId === st.classId));
    const rec = (s, type) => Att.find(s.id, st.date, st.session, type);
    if (!students.length) { box.innerHTML = `<p class="muted">${t('no_students')}</p>`; return; }
    if (!st.classId) {
      const by = {}; students.forEach(s => { const k = s.classId || ''; const g = by[k] = by[k] || { total: 0, inn: 0, late: 0, out: 0 }; g.total++; const i = rec(s, 'in'); if (i) { g.inn++; if (i.status === 'late') g.late++; } if (rec(s, 'out')) g.out++; });
      const rows = Object.keys(by).sort((a, b) => collator.compare(Store.className(a), Store.className(b))).map(k => { const g = by[k]; return `<tr><td><a href="#/classes/${esc(k)}">${esc(Store.className(k) || '—')}</a></td><td class="num">${g.total}</td><td class="num">${g.inn}</td><td class="num">${g.late}</td><td class="num">${g.out}</td><td class="num"><b>${g.total - g.inn}</b></td></tr>`; }).join('');
      box.innerHTML = `<div class="table-wrap"><table class="tbl"><thead><tr><th>${t('h_class')}</th><th class="num">${t('stat_active')}</th><th class="num">${t('type_in')}</th><th class="num">${t('late_n')}</th><th class="num">${t('type_out')}</th><th class="num">${t('not_yet')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      return;
    }
    const list = StudentsUI.sorted(students);
    let n = 0, pin = 0, late = 0;
    const rows = list.map((s, i) => {
      const ri = rec(s, 'in'), ro = rec(s, 'out'), cur = rec(s, st.type); if (ri) { pin++; if (ri.status === 'late') late++; }
      return `<tr><td class="num">${++n}</td><td>${esc(s.lastName + ' ' + s.firstName)}</td>
        <td class="nowrap">${ri ? Attendance.timeOf(ri) + (ri.status === 'late' ? ` <span class="chip warn">${t('late_by', { m: ri.lateMin })}</span>` : '') : '<span class="muted">—</span>'}</td>
        <td class="nowrap">${ro ? Attendance.timeOf(ro) : '<span class="muted">—</span>'}</td>
        <td class="actions"><button class="btn sm ${cur ? 'danger' : ''}" data-act="afToggle" data-id="${esc(s.id)}">${cur ? t('unmark') : t('mark')}</button></td></tr>`;
    }).join('');
    box.innerHTML = `<div class="chips"><span class="chip ok">${t('present_n')}: <b>${pin}</b></span><span class="chip warn">${t('late_n')}: <b>${late}</b></span><span class="chip err">${t('not_yet')}: <b>${list.length - pin}</b></span></div>
      <div class="table-wrap"><table class="tbl compact"><thead><tr><th class="num">#</th><th>${t('full_name')}</th><th>${t('type_in')}</th><th>${t('type_out')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
};

/* ---------- أحداث الصفحة ---------- */
const afSet = (id, v) => $$('#' + id + ' .seg-btn').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); });
ACT.afSession = el => { Sound.unlock(); Attendance.state.session = el.dataset.v; afSet('afSession', el.dataset.v); AF.showResult({ kind: 'idle' }, true); AF.updateAll(); };
ACT.afType = el => { Sound.unlock(); Attendance.state.type = el.dataset.v; afSet('afType', el.dataset.v); AF.showResult({ kind: 'idle' }, true); AF.updateAll(); };
CHG.afSound = el => { Sound.set(el.checked); Sound.unlock(); if (el.checked) Sound.ok(); };
CHG.afClass = el => { Attendance.state.classId = el.value; AF.updateSummary(); };
CHG.afDate = async el => {
  let v = parseDate(el.value); if (!v || v > todayISO()) v = todayISO();
  el.value = v; Attendance.state.date = v; Attendance.state.stamp = todayISO();
  await Att.ensure(v.slice(0, 7)); AF.updateAll();
};
SUB.afManual = async form => {
  Sound.unlock();
  const raw = form.elements.code.value.trim(); form.elements.code.value = ''; form.elements.code.focus();
  if (!raw) return;
  await AF.handle(raw, /^(SA:)?[A-Z2-9]{8}$/i.test(raw) ? 'qr' : 'manual');
};
ACT.afCam = async () => {
  Sound.unlock();
  const btn = $('#afCamBtn');
  if (Scanner.running) { Scanner.stop(); afCamUi(false); return; }
  if (!Scanner.supported()) { AF.showResult({ kind: 'error', message: t('camera_err_secure') }); return; }
  btn.disabled = true;
  try { await Scanner.start($('#afVideo')); afCamUi(true); }
  catch (e) {
    console.error(e); afCamUi(false);
    const msg = e && e.name === 'NotAllowedError' ? t('camera_err_denied') : (e && e.name === 'NotFoundError' ? t('camera_err_none') : t('camera_err_generic') + ' ' + (e && e.message || ''));
    AF.showResult({ kind: 'error', message: msg });
  }
  btn.disabled = false;
};
function afCamUi(on) {
  const btn = $('#afCamBtn'); if (!btn) return;
  btn.innerHTML = `${icon('camera')} <span>${t(on ? 'camera_stop' : 'camera_start')}</span>`;
  $('#afIdle').hidden = on; $('#afFrame').hidden = !on; $('#afSwitch').hidden = !on;
}
ACT.afSwitch = async () => { Scanner.facing = Scanner.facing === 'environment' ? 'user' : 'environment'; try { await Scanner.start($('#afVideo')); } catch (e) { AF.showResult({ kind: 'error', message: t('camera_err_generic') }); afCamUi(false); } };
ACT.afToggle = async el => {
  const s = Store.get('students', el.dataset.id); if (!s || !Auth.canStudent(s)) return;
  const st = Attendance.state; await Att.ensure(st.date.slice(0, 7));
  const ex = Att.find(s.id, st.date, st.session, st.type);
  if (ex) Att.remove(ex); else await Attendance.record(s, { source: 'manual' });
  AF.updateRecent(); AF.updateSummary();
};
ACT.afDel = el => {
  const st = Attendance.state, rec = AF.recs().find(r => Att.key(r) === el.dataset.key); if (!rec) return;
  const s = Store.get('students', rec.studentId); if (!s || !Auth.canStudent(s)) return;
  Att.remove(rec); AF.updateRecent(); AF.updateSummary();
};

/* =====================================================================
   رموز QR للتلاميذ: عرض / طباعة بطاقات / استبدال
   ===================================================================== */
const QrUI = {
  svg(s, opts) { return QR.toSVG(QR.encode(Store.qrPayload(s)), opts); },
  show(id) {
    const s = Store.get('students', id);
    if (!s || !Auth.canStudent(s)) return Toast.show(t('err_forbidden'), 'error');
    const body = () => `<div class="qr-show"><div class="qr-img">${this.svg(s)}</div><div><b>${esc(s.lastName + ' ' + s.firstName)}</b><br><span class="muted">${esc(Store.className(s.classId) || '—')} · ${esc(s.code)}</span></div><p class="muted small">${t('qr_hint')}</p></div>`;
    Modal.open({
      title: t('qr_code'), body: body(),
      buttons: [{ label: t('close') }, { label: t('print'), onClick: () => { this.printCards([s]); return false; } },
        { label: t('replace_qr'), cls: 'danger', onClick: async ov => { if (await this.replace(s.id)) $('.modal-body', ov).innerHTML = body(); return false; } }]
    });
  },
  async replace(id) {
    const s = Store.get('students', id); if (!s || !Auth.canStudent(s)) return false;
    if (!await Modal.confirm(t('confirm_replace_qr', { name: s.lastName + ' ' + s.firstName }), { danger: true, okLabel: t('replace_qr') })) return false;
    Store.update('students', s.id, { qr: Store.newQr(), qrChangedAt: new Date().toISOString() });
    Toast.show(t('qr_replaced'), 'success'); return true;
  },
  async printCards(list) {
    list = StudentsUI.sorted(list.filter(s => Auth.canStudent(s)));
    if (!list.length) return Toast.show(t('no_students'), 'error');
    if (list.length > 150 && !await Modal.confirm(t('confirm_many_cards', { n: list.length }))) return;
    const school = esc(Store.data.settings.schoolName || t('app_name'));
    Print.go(`<div class="print-sheet"><div class="qc-grid">${list.map(s => `<div class="qc"><div class="qc-school">${school}</div><div class="qc-qr">${this.svg(s, { quiet: 2 })}</div>
      <div class="qc-name">${esc(s.lastName + ' ' + s.firstName)}</div><div class="qc-class">${esc(Store.className(s.classId) || '')} · ${esc(s.code)}</div></div>`).join('')}</div></div>`);
  }
};
ACT.stQr = el => QrUI.show(el.dataset.id);
ACT.stQrCards = () => QrUI.printCards(Pages.students.filtered());
ACT.clQrCards = el => { const c = Store.get('classes', el.dataset.id); if (c && Auth.canClass(c.id)) QrUI.printCards(Store.list('students').filter(s => s.classId === c.id && s.status === 'active')); };

/* ---- 99-app.js ---- */
'use strict';
/* =====================================================================
   99-app.js — الموجّه (router)، الهيكل العام، تفويض الأحداث، الإقلاع
   ===================================================================== */
const NAV = [
  { name: 'dashboard', icon: 'home', label: 'nav_dashboard' },
  { name: 'students', icon: 'users', label: 'nav_students' },
  { name: 'classes', icon: 'grid', label: 'nav_classes' },
  { name: 'attendance', icon: 'scan', label: 'nav_attendance' },
  { name: 'supervisors', icon: 'shield', label: 'nav_supervisors', admin: true },
  { name: 'settings', icon: 'sliders', label: 'nav_settings' }
];

const App = {
  shell: false, current: null, route: { name: 'dashboard', params: [] },

  parseRoute() {
    const seg = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    let name = seg[0] || 'dashboard', params = seg.slice(1);
    if (name === 'classes' && params[0]) name = 'classDetail';
    let page = Pages[name];
    if (!page || name === 'login' || (page.admin && !Auth.isAdmin())) { name = 'dashboard'; params = []; page = Pages.dashboard; history.replaceState(null, '', '#/dashboard'); }
    this.route = { name, params };
    return page;
  },

  renderShell() {
    const u = Auth.user(), s = Store.data.settings;
    $('#app').innerHTML = `<div class="app">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-act="toggleNav" aria-label="${esc(t('menu'))}">${icon('menu')}</button>
        <a class="brand" href="#/dashboard">${s.logo ? `<img src="${esc(s.logo)}" alt="">` : icon('school')}<span>${esc(s.schoolName || t('app_name'))}</span></a>
        <div class="spacer"></div>
        <div class="userchip"><span class="uname">${esc(u.fullName)}</span><span class="badge b-role">${esc(t('role_' + u.role))}</span></div>
        <button class="icon-btn" data-act="logout" title="${esc(t('logout'))}" aria-label="${esc(t('logout'))}">${icon('logout')}</button>
      </header>
      <div class="body">
        <nav class="sidebar" id="sidebar" aria-label="${esc(t('menu'))}">${NAV.filter(n => !n.admin || Auth.isAdmin()).map(n =>
          `<a href="#/${n.name}" data-nav="${n.name}">${icon(n.icon)}<span>${t(n.label)}</span></a>`).join('')}
          <div class="sidebar-foot">${esc(t('app_name'))} · v1</div></nav>
        <div class="scrim" data-act="toggleNav"></div>
        <main id="view" tabindex="-1"></main>
      </div></div>`;
    this.shell = true;
  },

  render() {
    if (!Store.data) return;
    if (!Auth.user()) { if (this.current && this.current.unmount) this.current.unmount(); this.current = null; this.shell = false; return Pages.login.show(); }
    const page = this.parseRoute();
    if (this.current && this.current !== page && this.current.unmount) this.current.unmount();
    this.current = page;
    if (!this.shell) this.renderShell();
    const { name, params } = this.route;
    $$('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === (name === 'classDetail' ? 'classes' : name)));
    $('#view').innerHTML = page.render(...params);
    if (page.mount) page.mount(...params);
    $('#sidebar').classList.remove('open'); document.body.classList.remove('nav-open');
    document.title = t(page.title ? page.title : 'nav_' + (name === 'classDetail' ? 'classes' : name)) + ' — ' + t('app_name');
  },

  refresh() { const y = window.scrollY; this.render(); window.scrollTo(0, y); }
};
ACT.toggleNav = () => { $('#sidebar').classList.toggle('open'); document.body.classList.toggle('nav-open'); };

/* ---- تفويض الأحداث ---- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === 'A') e.preventDefault(); Promise.resolve(fn(el, e)).catch(err => { console.error(err); Toast.show(String(err.message || err), 'error'); }); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && CHG[el.dataset.change]) Promise.resolve(CHG[el.dataset.change](el, e)).catch(err => { console.error(err); Toast.show(String(err.message || err), 'error'); });
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]'); if (!f) return;
  e.preventDefault();
  const fn = SUB[f.dataset.submit];
  if (fn) Promise.resolve(fn(f, e)).catch(err => { console.error(err); Toast.show(String(err.message || err), 'error'); });
});
window.addEventListener('hashchange', () => App.render());
window.addEventListener('pagehide', () => Store.flush());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });

/* ---- الإقلاع ---- */
(async function boot() {
  UI.apply();
  try {
    await Store.init();
    Auth.restore();
    App.render();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="login-wrap"><div class="card login"><h1>${esc(t('app_name'))}</h1><div class="form-error">${esc(t('err_boot'))}<br><small>${esc(e.message || e)}</small></div></div></div>`;
  }
})();

</script>
</body>
