<script id="androidShim">

(function () {

    var a = e.target && e.target.closest && e.target.closest('a[download]');

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>إدارة حضور التلاميذ</title>
<style>
/* ===== الثيمات ===== */
:root{--bg:#f3f5f9;--surface:#fff;--surface2:#f6f8fb;--text:#172033;--muted:#5b6b82;--border:#dbe2ec;--primary:#2563eb;--primary-d:#1d4ed8;--on-primary:#fff;--danger:#c62828;--ok:#15803d;--warn:#b45309;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);--radius:12px;color-scheme:light}
[data-theme=dark]{--bg:#0e1525;--surface:#17213a;--surface2:#1c2845;--text:#e6ebf5;--muted:#a3b1ca;--border:#2c3a5c;--primary:#6aa5ff;--primary-d:#8fbaff;--on-primary:#0a1224;--danger:#ff8a8a;--ok:#4ade80;--warn:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
[data-theme=green]{--bg:#f0f7f2;--primary:#15803d;--primary-d:#166534;--border:#d3e3d9;--surface2:#f4faf6}
[data-theme=violet]{--bg:#f5f3fb;--primary:#6d28d9;--primary-d:#5b21b6;--border:#dfd9f0;--surface2:#f8f6fd}

*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.5}
h1,h2,h3,h4{margin:0 0 .6rem;line-height:1.25}
h2{font-size:1.4rem}h3{font-size:1.05rem}h4{font-size:.95rem;margin-top:.4rem}
p{margin:.3rem 0 .8rem}
a{color:var(--primary)}
hr{border:0;border-top:1px solid var(--border);margin:1.1rem 0}
small,.small{font-size:.82rem}
.muted{color:var(--muted)}.center{text-align:center}.nowrap{white-space:nowrap}.grow{flex:1 1 220px}.full{grid-column:1/-1}.pre{white-space:pre-line}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}

/* ===== الهيكل ===== */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;background:var(--surface);border-bottom:1px solid var(--border);min-height:57px}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;color:var(--text);text-decoration:none;min-width:0}
.brand img{height:34px;width:auto;border-radius:6px}.brand .ic{width:1.6em;height:1.6em;color:var(--primary)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:.5rem;font-size:.9rem}
.menu-btn{display:none}
.body{display:flex;flex:1;min-height:0}
.sidebar{width:232px;flex:none;background:var(--surface);border-inline-end:1px solid var(--border);padding:.9rem .6rem;display:flex;flex-direction:column;gap:.2rem;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.sidebar a{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:9px;color:var(--text);text-decoration:none;font-weight:600}
.sidebar a:hover{background:var(--surface2)}
.sidebar a.active{background:var(--primary);color:var(--on-primary)}
.sidebar-foot{margin-top:auto;padding:.6rem;font-size:.75rem;color:var(--muted)}
main{flex:1;min-width:0;padding:1.3rem;max-width:1240px;margin-inline:auto;width:100%}
.scrim{display:none}
@media (max-width:860px){
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;height:auto;z-index:50;transition:transform .2s;box-shadow:var(--shadow)}
  [dir=rtl] .sidebar{transform:translateX(100%)}[dir=ltr] .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:40}
  main{padding:.9rem}.userchip .uname{display:none}
}

/* ===== مكوّنات ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow);margin-bottom:1rem}
.card h3{display:flex;align-items:center;gap:.5rem}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.7rem;margin-bottom:1rem}
.page-head h2{margin:0}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.45rem .9rem;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-weight:600;min-height:40px;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.btn.primary:hover{background:var(--primary-d)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.modal-foot .btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:32px;padding:.15rem .65rem;font-size:.85rem}
.btn.block{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:0;background:transparent;color:var(--text);border-radius:9px;cursor:pointer;font:inherit}
.icon-btn:hover{background:var(--surface2)}.icon-btn.danger{color:var(--danger)}.icon-btn .ic{width:1.25rem;height:1.25rem}
.fld{display:flex;flex-direction:column;gap:.3rem;font-size:.92rem;min-width:0}
.fld>span{color:var(--muted);font-weight:600;font-size:.85rem}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.5rem .7rem;min-height:40px;width:100%;min-width:0}
input[type=checkbox]{width:1.1rem;height:1.1rem;min-height:0;padding:0;accent-color:var(--primary)}
input[readonly]{background:var(--surface2);color:var(--muted)}
input[type=file]{padding:.4rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.85rem}
.form-error{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border:1px solid var(--danger);border-radius:9px;padding:.55rem .8rem;margin-bottom:.8rem;font-weight:600}
.pw{display:flex;gap:.3rem;align-items:center}
.chk{display:flex;align-items:center;gap:.5rem;cursor:pointer}.chk.strong{font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end}
.toolbar .fld{flex:0 1 190px}.toolbar .fld.grow{flex:1 1 240px}
.list-meta{color:var(--muted);font-size:.88rem;margin-bottom:.5rem}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{padding:.55rem .65rem;border-bottom:1px solid var(--border);text-align:start;vertical-align:middle}
.tbl th{background:var(--surface2);font-size:.82rem;color:var(--muted);white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl.compact th,.tbl.compact td{padding:.35rem .5rem}
.tbl .num{width:2.6rem;text-align:center;color:var(--muted)}
.tbl .actions{text-align:end}.tbl .start{text-align:start}
.row-skip{opacity:.5}
.badge{display:inline-block;padding:.12rem .55rem;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--surface2);border:1px solid var(--border)}
.b-active{background:rgba(22,163,74,.14);color:var(--ok);border-color:transparent}
.b-dropped{background:rgba(217,119,6,.15);color:var(--warn);border-color:transparent}
.b-expelled{background:rgba(220,38,38,.13);color:var(--danger);border-color:transparent}
.b-oriented{background:rgba(37,99,235,.13);color:var(--primary);border-color:transparent}
.b-role{background:var(--surface2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.4rem 0 .9rem}.chips.tight{margin:0}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .7rem;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:.85rem}
.chip.ok{background:rgba(22,163,74,.12);color:var(--ok)}.chip.warn{background:rgba(217,119,6,.13);color:var(--warn)}.chip.err{background:rgba(220,38,38,.12);color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:2rem 1rem;color:var(--muted);text-align:center}
.empty .ic{width:2.6rem;height:2.6rem;opacity:.6}
.pager{display:flex;gap:.8rem;align-items:center;justify-content:center;padding:.8rem 0 .2rem}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.tab{border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:.6rem 1rem;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.back{display:inline-flex;align-items:center;gap:.3rem;font-size:.88rem;text-decoration:none;margin-bottom:.3rem}
[dir=rtl] .back .ic{transform:scaleX(-1)}
.alert{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem 1rem;border-radius:var(--radius);margin-bottom:.9rem;border:1px solid var(--border);background:var(--surface)}
.alert.warn{border-color:var(--warn);background:rgba(217,119,6,.1)}.alert.info{border-color:var(--primary);background:rgba(37,99,235,.08)}
.alert .ic{margin-top:.2rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem;margin-bottom:1rem}
.stat{display:flex;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.7rem;line-height:1.1}.stat span{color:var(--muted);font-size:.85rem}
.stat-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--surface2);color:var(--primary)}
.stat-ic .ic{width:1.4rem;height:1.4rem}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.bar-row{display:grid;grid-template-columns:minmax(6rem,10rem) 1fr 3rem;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.9rem}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar-row b{text-align:end}
.status-list>div{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border)}
.cta{text-align:center}.cta .btn-row{justify-content:center}
.level-block{margin-bottom:1.2rem}.level-block h3 small{color:var(--muted);font-weight:400}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.class-card{margin:0;display:flex;flex-direction:column;gap:.3rem}
.class-name{font-size:1.25rem;font-weight:800;text-decoration:none}
.picker{max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);padding:.6rem .8rem}
.pick-level{padding:.4rem 0;border-bottom:1px dashed var(--border)}.pick-level:last-child{border-bottom:0}
.pick-classes{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;padding:.35rem 1.6rem}
.settings-grid{display:grid;gap:1rem;max-width:900px}
.logo-row{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin:.8rem 0}
.logo-prev{height:54px;border:1px solid var(--border);border-radius:8px;padding:3px;background:#fff}
.hint{display:flex;gap:.4rem;font-size:.85rem;color:var(--warn);margin:.8rem 0 0}

/* ===== الدخول ===== */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:1rem}
.login{width:min(400px,100%);padding:1.6rem}
.login h1{text-align:center;font-size:1.4rem}
.login-logo{display:grid;place-items:center;margin-bottom:.6rem}
.login-logo .ic{width:3rem;height:3rem;color:var(--primary)}.login-logo img{max-height:72px}
.login .fld{margin-bottom:.8rem}
.login-prefs{display:flex;gap:.5rem;margin-top:1rem}.login-prefs select{min-height:36px;font-size:.85rem}

/* ===== النوافذ والإشعارات ===== */
.overlay{position:fixed;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow:auto;z-index:100}
.modal{background:var(--surface);color:var(--text);border-radius:var(--radius);width:min(540px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35);border:1px solid var(--border)}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--border)}.modal-head h3{margin:0}
.modal-body{padding:1rem}
.modal-foot{display:flex;gap:.5rem;justify-content:flex-end;padding:.8rem 1rem;border-top:1px solid var(--border)}
.toasts{position:fixed;bottom:1rem;inset-inline-start:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:200;max-width:min(420px,calc(100vw - 2rem))}
.toast{background:#1f2937;color:#fff;padding:.7rem 1rem;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:.92rem}
.toast.success{background:#166534}.toast.error{background:#b91c1c}


/* ===== الحضور والماسح ===== */
.af-controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end}
.af-controls .fld{flex:0 1 auto}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg-btn{border:0;background:var(--surface);color:var(--text);font:inherit;font-weight:700;padding:.5rem 1.1rem;min-height:40px;cursor:pointer}
.seg-btn+.seg-btn{border-inline-start:1px solid var(--border)}
.seg-btn.active{background:var(--primary);color:var(--on-primary)}
.af-sound{padding-bottom:.55rem}
.af-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:860px){.af-grid{grid-template-columns:minmax(0,1fr)}}
.af-video{position:relative;aspect-ratio:4/3;background:#0b1220;border-radius:12px;overflow:hidden;display:grid;place-items:center;margin-bottom:.7rem}
.af-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.af-frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.af-idle{position:relative;display:flex;flex-direction:column;align-items:center;gap:.5rem;color:#9fb0cc;text-align:center;padding:1rem}
.af-idle .ic{width:2.6rem;height:2.6rem}
.af-manual{display:flex;gap:.5rem;margin-top:.7rem}
.af-manual input{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em}
.af-result{display:flex;gap:1rem;align-items:center;min-height:104px;border-width:2px;transition:background .15s,border-color .15s}
.af-result .ar-ic{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;flex:none;background:var(--surface2);color:var(--muted)}
.af-result .ar-ic .ic{width:1.7rem;height:1.7rem}
.ar-name{font-size:1.2rem}
.af-result.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}.af-result.ok .ar-ic{background:var(--ok);color:#fff}
.af-result.late{border-color:var(--warn);background:rgba(217,119,6,.13)}.af-result.late .ar-ic{background:var(--warn);color:#fff}
.af-result.warn{border-color:var(--warn);background:rgba(217,119,6,.1)}.af-result.warn .ar-ic{background:var(--warn);color:#fff}
.af-result.err{border-color:var(--danger);background:rgba(220,38,38,.1)}.af-result.err .ar-ic{background:var(--danger);color:#fff}
.af-list{list-style:none;margin:0;padding:0}
.af-list li{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--border)}
.af-time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.2rem}.af-n{flex:1;min-width:0}
.qr-show{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center}
.qr-img{width:min(240px,70vw);border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}.qr-img svg{display:block;width:100%;height:auto}
.qc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
.qc{border:1px dashed #777;border-radius:3mm;padding:3mm;text-align:center;break-inside:avoid;page-break-inside:avoid;color:#000}
.qc-school{font-size:9px;line-height:1.2;margin-bottom:2mm}.qc-qr svg{width:34mm;height:34mm}
.qc-name{font-weight:700;font-size:13px;margin-top:1mm}.qc-class{font-size:11px}

/* ===== الطباعة ===== */
#printArea{display:none}
.ps-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.8rem}
.ps-school{display:flex;gap:.6rem;align-items:center;line-height:1.5}.ps-logo{height:56px}
.ps-title{text-align:center;margin:.8rem 0;font-size:1.25rem}
.ps-table{width:100%;border-collapse:collapse}
.ps-table th,.ps-table td{border:1px solid #000;padding:4px 7px;font-size:13px;text-align:start}
.ps-table th{background:#eee}.ps-foot{margin-top:.8rem;font-size:12px}
@media print{
  @page{size:A4;margin:14mm}
  body.printing .app,body.printing .toasts,body.printing .overlay{display:none!important}
  body.printing #printArea{display:block}
  body.printing{background:#fff!important;color:#000!important}
  body.printing .ps-table th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>
</head>

/* ---- 00-util.js ---- */
'use strict';
/* =====================================================================
   00-util.js — أدوات عامة: DOM، تواريخ، إشعارات، نوافذ، أيقونات
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n, w = 2) => String(n).padStart(w, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDate = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : (iso || ''); };
const fmtDateTime = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : fmtDate(todayISOof(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const todayISOof = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const debounce = (fn, ms = 200) => { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; };
const collator = new Intl.Collator(['ar', 'fr', 'en'], { numeric: true, sensitivity: 'base' });

/* تطبيع النص للمقارنة والبحث: يزيل التشكيل والمسافات ويوحّد الألف والياء */
const norm = s => String(s == null ? '' : s).normalize('NFKD')
  .replace(/[̀-ًͯ-ٰٟـ]/g, '')
  .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
  .toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g, '');

const westernDigits = s => String(s).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0);

/* يحوّل أي صيغة تاريخ شائعة (dd/mm/yyyy ، yyyy-mm-dd ، رقم إكسل التسلسلي) إلى yyyy-mm-dd أو '' */
function parseDate(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date) return isNaN(v) ? '' : todayISOof(v);
  const s = westernDigits(String(v).trim());
  if (!s) return '';
  const valid = (y, m, d) => {
    const dt = new Date(Date.UTC(y, m - 1, d));
    return (dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d && y >= 1900 && y <= 2100)
      ? y + '-' + pad(m) + '-' + pad(d) : '';
  };
  let m;
  if (/^\d+(\.\d+)?$/.test(s)) {
    const n = parseFloat(s);
    if (n > 10000 && n < 80000) {
      const dt = new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000);
      return valid(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
    }
    return '';
  }
  if ((m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s))) return valid(+m[1], +m[2], +m[3]);
  if ((m = /^(\d{1,2})[-/. ](\d{1,2})[-/. ](\d{2,4})$/.exec(s))) {
    let y = +m[3];
    if (m[3].length === 2) y += y > 30 ? 1900 : 2000;
    return valid(y, +m[2], +m[1]);
  }
  return '';
}

const Toast = {
  show(msg, type = 'info', ms = 3800) {
    const box = $('#toasts'); if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type; el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.textContent = msg; box.appendChild(el);
    setTimeout(() => el.remove(), ms);
  }
};

/* ---------- نوافذ حوارية ---------- */
const Modal = {
  stack: [],
  open({ title, body, buttons = [], wide = false, onMount, onClose, backdrop = false }) {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-m="close" aria-label="${esc(t('close'))}">✕</button></div>
      <div class="modal-body">${body}</div><div class="modal-foot"></div></div>`;
    const foot = $('.modal-foot', ov);
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn ' + (b.cls || ''); btn.textContent = b.label;
      btn.addEventListener('click', async () => {
        if (btn.disabled) return; btn.disabled = true;
        let r; try { r = b.onClick ? await b.onClick(ov) : undefined; } catch (e) { console.error(e); Toast.show(String(e.message || e), 'error'); r = false; }
        btn.disabled = false;
        if (r !== false) Modal.close(ov);
      });
      foot.appendChild(btn);
    });
    if (!buttons.length) foot.remove();
    ov._onClose = onClose;
    ov.addEventListener('mousedown', e => { if (backdrop && e.target === ov) Modal.close(ov); });
    ov.addEventListener('click', e => { if (e.target.closest('[data-m=close]')) Modal.close(ov); });
    document.body.appendChild(ov); this.stack.push(ov);
    if (onMount) onMount(ov);
    const first = $('input:not([type=file]):not([type=hidden]),select,textarea', ov);
    if (first) first.focus();
    return ov;
  },
  close(ov) {
    ov = ov || this.stack[this.stack.length - 1]; if (!ov) return;
    ov.remove(); this.stack = this.stack.filter(x => x !== ov);
    if (ov._onClose) { const f = ov._onClose; ov._onClose = null; f(); }
  },
  confirm(msg, { danger = false, okLabel } = {}) {
    return new Promise(resolve => {
      Modal.open({
        title: t('confirm'), body: `<p class="pre">${esc(msg)}</p>`,
        onClose: () => resolve(false),
        buttons: [
          { label: t('cancel'), onClick: () => { resolve(false); } },
          { label: okLabel || t('ok'), cls: danger ? 'danger' : 'primary', onClick: () => { resolve(true); } }
        ]
      });
    });
  },
  error(ov, msg) { const el = $('.form-error', ov); if (el) { el.textContent = msg; el.hidden = !msg; } else Toast.show(msg, 'error'); return false; }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Modal.stack.length) Modal.close(); });

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function decodeText(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { try { return new TextDecoder('windows-1256').decode(buf); } catch (_) { return new TextDecoder().decode(buf); } }
}

function setLang(l) {
  LANG = LANGS[l] ? l : 'ar';
  document.documentElement.lang = LANG; document.documentElement.dir = LANGS[LANG].dir;
}
function t(key, vars) {
  const e = I18N[key]; let s = e ? (e[LANGS[LANG].i] || e[0]) : key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : '');
  return s;
}

'use strict';
/* =====================================================================
   02-store.js — قاعدة البيانات الداخلية (IndexedDB) + بيانات أولية + نسخ احتياطي
   المجموعات: settings, users, levels, classes, students, attendance, meta
   ===================================================================== */
const APP_ID = 'school-attendance';
const SCHEMA = 1;
const STATUSES = ['active', 'dropped', 'expelled', 'oriented'];

const idb = {
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no indexedDB'));
      const r = indexedDB.open('school-attendance', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    });
  },
  get(db, k) { return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  keys(db) { return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  del(db, k) { return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  put(db, k, v) { return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }
};

const Store = {
  data: null, db: null, _timer: null, mode: 'indexeddb',

  async init() {
    try {
      this.db = await idb.open();
      this.data = (await idb.get(this.db, 'data')) || null;
    } catch (e) {
      console.warn('IndexedDB غير متاح، استعمال localStorage', e);
      this.db = null; this.mode = 'localstorage';
      try { this.data = JSON.parse(localStorage.getItem('att_data') || 'null'); } catch (_) { this.data = null; }
    }
    if (!this.data) { this.data = await this.seed(); await this.saveNow(); }
    this.migrate();
    await Att.init();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  },

  academicYear() {
    const d = new Date(), y = d.getFullYear();
    return d.getMonth() >= 7 ? y + '/' + (y + 1) : (y - 1) + '/' + y;
  },

  async seed() {
    const cred = await Auth.makeCred('admin');
    const names = ['السنة الأولى متوسط', 'السنة الثانية متوسط', 'السنة الثالثة متوسط', 'السنة الرابعة متوسط'];
    const levels = names.map((name, i) => ({ id: 'lv' + (i + 1), name, short: (i + 1) + 'AM', order: i + 1 }));
    const classes = [];
    levels.forEach(l => { for (let k = 1; k <= 4; k++) classes.push({ id: uid('c'), name: l.short + k, levelId: l.id, order: k }); });
    const now = new Date().toISOString();
    return {
      app: APP_ID, schema: SCHEMA,
      settings: {
        schoolName: '', directorate: '', wilaya: '', address: '', phone: '', principal: '',
        year: this.academicYear(), logo: '',
        morningStart: '08:00', afternoonStart: '13:00', graceMinutes: 10
      },
      users: [{ id: 'u_admin', role: 'admin', fullName: 'المسؤول', username: 'admin', ...cred, phone: '', email: '', active: true, mustChange: true }],
      levels, classes, students: [], attendance: [],
      meta: { createdAt: now, updatedAt: now, studentSeq: 0, lastBackupAt: null }
    };
  },

  migrate() {
    const d = this.data;
    d.app = APP_ID; d.schema = SCHEMA;
    ['users', 'levels', 'classes', 'students', 'attendance'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
    d.settings = Object.assign({ schoolName: '', directorate: '', wilaya: '', address: '', phone: '', principal: '', year: this.academicYear(), logo: '', morningStart: '08:00', afternoonStart: '13:00', graceMinutes: 10 }, d.settings || {});
    d.meta = Object.assign({ createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), studentSeq: 0, lastBackupAt: null }, d.meta || {});
    const used = new Set(d.students.filter(x => x.qr).map(x => x.qr));
    d.students.forEach(x => { if (!x.qr) x.qr = this.newQr(used); });
    const maxCode = d.students.reduce((m, s) => Math.max(m, parseInt(s.code, 10) || 0), 0);
    if (d.meta.studentSeq < maxCode) d.meta.studentSeq = maxCode;
  },

  /* ---- حفظ ---- */
  save() { clearTimeout(this._timer); this._timer = setTimeout(() => this.saveNow().catch(e => Toast.show(t('err_save') + ': ' + e.message, 'error')), 120); },
  async saveNow() {
    clearTimeout(this._timer); this._timer = null;
    if (this.db) await idb.put(this.db, 'data', this.data);
    else localStorage.setItem('att_data', JSON.stringify(this.data));
  },
  flush() { if (this._timer) this.saveNow().catch(() => {}); Att.flush(); },
  touch() { this.data.meta.updatedAt = new Date().toISOString(); this.save(); },

  /* ---- CRUD ---- */
  list(c) { return this.data[c]; },
  get(c, id) { return this.data[c].find(x => x.id === id) || null; },
  add(c, obj) { obj.id = obj.id || uid(c[0]); this.data[c].push(obj); this.touch(); return obj; },
  addMany(c, arr) { arr.forEach(o => { o.id = o.id || uid(c[0]); this.data[c].push(o); }); this.touch(); return arr; },
  update(c, id, patch) { const o = this.get(c, id); if (!o) return null; Object.assign(o, patch); this.touch(); return o; },
  remove(c, id) { const a = this.data[c], i = a.findIndex(x => x.id === id); if (i < 0) return false; a.splice(i, 1); this.touch(); return true; },
  /* رمز QR سري لكل تلميذ (8 أحرف بلا ما يُلتبس: لا O/0/I/1). المحتوى المطبوع: SA:<رمز> */
  newQr(used) {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', set = used || new Set(this.data.students.map(x => x.qr));
    let tok;
    do { tok = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => A[b % 32]).join(''); } while (set.has(tok));
    set.add(tok); return tok;
  },
  qrPayload(s) { return 'SA:' + s.qr; },
  /* يقبل محتوى QR أو الرمز وحده أو الرقم التسلسلي للتلميذ */
  studentByScan(raw) {
    let v = String(raw || '').trim(); if (!v) return null;
    if (/^SA:/i.test(v)) v = v.slice(3);
    const up = v.toUpperCase();
    let s = this.data.students.find(x => x.qr === up);
    if (!s && /^\d{1,8}$/.test(v)) { const code = v.padStart(6, '0'); s = this.data.students.find(x => x.code === code); }
    return s || null;
  },
  nextCode() { const n = ++this.data.meta.studentSeq; return String(n).padStart(6, '0'); },

  /* ---- استعلامات ---- */
  sortedLevels() { return this.data.levels.slice().sort((a, b) => (a.order - b.order) || collator.compare(a.name, b.name)); },
  sortedClasses(levelId) {
    const lo = {}; this.data.levels.forEach(l => lo[l.id] = l.order);
    return this.data.classes.filter(c => !levelId || c.levelId === levelId)
      .sort((a, b) => ((lo[a.levelId] || 0) - (lo[b.levelId] || 0)) || ((a.order || 0) - (b.order || 0)) || collator.compare(a.name, b.name));
  },
  className(id) { const c = id && this.get('classes', id); return c ? c.name : ''; },
  levelName(id) { const l = id && this.get('levels', id); return l ? l.name : ''; },
  levelOfStudent(s) { const c = s.classId && this.get('classes', s.classId); return c ? c.levelId : (s.levelId || ''); },
  supervisorsOfClass(cid) { return this.data.users.filter(u => u.role === 'supervisor' && (u.classIds || []).includes(cid)); },

  /* ---- نسخ احتياطي (يشمل سجلات الحضور من كل الأشهر) ---- */
  async exportObject() { return { app: APP_ID, schema: SCHEMA, exportedAt: new Date().toISOString(), data: Object.assign({}, this.data, { attendance: await Att.all() }) }; },
  async exportJSON() { return JSON.stringify(await this.exportObject()); },
  validateBackup(obj) {
    if (!obj || obj.app !== APP_ID || !obj.data) return false;
    const d = obj.data;
    return Array.isArray(d.users) && d.users.some(u => u.role === 'admin') && Array.isArray(d.levels) && Array.isArray(d.classes) && Array.isArray(d.students) && typeof d.settings === 'object';
  },
  async importObject(obj) {
    if (!this.validateBackup(obj)) throw new Error(t('err_bad_backup'));
    const att = Array.isArray(obj.data.attendance) ? obj.data.attendance : [];
    this.data = Object.assign({}, obj.data, { attendance: [] }); this.migrate(); await this.saveNow();
    await Att.replaceAll(att);
  },
  async reset() { this.data = await this.seed(); await this.saveNow(); await Att.clear(); await Att.ensure(todayISO().slice(0, 7)); }
};

/* ---- 02b-attendance-store.js ---- */
'use strict';
/* =====================================================================
   02b-attendance-store.js — سجلات الحضور: تخزين شهري منفصل (att:YYYY-MM) لتبقى الكتابة سريعة
   السجل: {studentId, classId, date, session:'AM'|'PM', type:'in'|'out', ts, status:'present'|'late', lateMin, source:'qr'|'manual', by}
   المفتاح الفريد: studentId|date|session|type  (تسجيل واحد لكل تلميذ في كل فترة واتجاه)
   ===================================================================== */
const Att = {
  months: {}, dirty: new Set(), _timer: null,

  key(r) { return r.studentId + '|' + r.date + '|' + r.session + '|' + r.type; },
  async init() { this.months = {}; this.dirty.clear(); await this.ensure(todayISO().slice(0, 7)); },

  async _read(m) {
    let rows = null;
    if (Store.db) rows = await idb.get(Store.db, 'att:' + m);
    else { try { rows = JSON.parse(localStorage.getItem('att_m_' + m) || 'null'); } catch (e) { rows = null; } }
    return Array.isArray(rows) ? rows : [];
  },
  async ensure(m) { return this.months[m] || this._index(m, await this._read(m)); },
  _index(m, rows) {
    const o = { rows, map: new Map(), byDate: new Map() };
    rows.forEach(r => this._ix(o, r)); this.months[m] = o; return o;
  },
  _ix(o, r) { o.map.set(this.key(r), r); let a = o.byDate.get(r.date); if (!a) o.byDate.set(r.date, a = []); a.push(r); },

  find(studentId, date, session, type) { const o = this.months[date.slice(0, 7)]; return o ? (o.map.get(studentId + '|' + date + '|' + session + '|' + type) || null) : null; },
  day(date) { const o = this.months[date.slice(0, 7)]; return o ? (o.byDate.get(date) || []) : []; },

  add(rec) {
    const m = rec.date.slice(0, 7), o = this.months[m];
    if (!o) throw new Error('attendance month not loaded');
    o.rows.push(rec); this._ix(o, rec); this._mark(m);
  },
  remove(rec) {
    const m = rec.date.slice(0, 7), o = this.months[m]; if (!o) return false;
    const i = o.rows.indexOf(rec); if (i < 0) return false;
    o.rows.splice(i, 1); o.map.delete(this.key(rec));
    const a = o.byDate.get(rec.date); if (a) { const j = a.indexOf(rec); if (j >= 0) a.splice(j, 1); }
    this._mark(m); return true;
  },

  _mark(m) {
    this.dirty.add(m); clearTimeout(this._timer);
    this._timer = setTimeout(() => this.saveNow().catch(e => Toast.show(t('err_save') + ': ' + e.message, 'error')), 150);
  },
  async saveNow() {
    clearTimeout(this._timer); this._timer = null;
    const ms = Array.from(this.dirty); this.dirty.clear();
    for (const m of ms) {
      const rows = this.months[m] ? this.months[m].rows : [];
      if (Store.db) await idb.put(Store.db, 'att:' + m, rows); else localStorage.setItem('att_m_' + m, JSON.stringify(rows));
    }
  },
  flush() { if (this.dirty.size) this.saveNow().catch(() => {}); },

  async storedMonths() {
    if (Store.db) return (await idb.keys(Store.db)).filter(k => typeof k === 'string' && k.startsWith('att:')).map(k => k.slice(4));
    const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('att_m_')) out.push(k.slice(6)); } return out;
  },
  async all() {
    const set = new Set((await this.storedMonths()).concat(Object.keys(this.months))), out = [];
    for (const m of Array.from(set).sort()) { const o = await this.ensure(m); out.push(...o.rows); }
    return out;
  },
  async clear() {
    for (const m of await this.storedMonths()) { if (Store.db) await idb.del(Store.db, 'att:' + m); else localStorage.removeItem('att_m_' + m); }
    this.months = {}; this.dirty.clear(); clearTimeout(this._timer);
  },
  async replaceAll(rows) {
    await this.clear();
    const by = {};
    rows.forEach(r => { if (r && r.date && r.studentId && r.session && r.type) (by[r.date.slice(0, 7)] = by[r.date.slice(0, 7)] || []).push(r); });
    for (const m in by) { this._index(m, by[m]); this.dirty.add(m); }
    await this.saveNow(); await this.ensure(todayISO().slice(0, 7));
  }
};

'use strict';
/* =====================================================================
   03-auth.js — التجزئة (PBKDF2-SHA256)، الدخول، الصلاحيات حسب الأقسام المسندة
   ===================================================================== */
const ITER = 10000;

/* SHA-256 / HMAC / PBKDF2 بالجافاسكربت الخالص: احتياط عندما لا يتوفر crypto.subtle (مثلاً http على شبكة محلية) */
const K256 = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
const ror = (x, n) => (x >>> n) | (x << (32 - n));
function sha256(msg) {
  const l = msg.length, buf = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  buf.set(msg); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(buf.length - 4, (l * 8) >>> 0); dv.setUint32(buf.length - 8, Math.floor(l / 0x20000000));
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);
  for (let off = 0; off < buf.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = ror(w[i - 15], 7) ^ ror(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = ror(w[i - 2], 17) ^ ror(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25), ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K256[i] + w[i]) | 0;
      const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
  }
  const out = new Uint8Array(32), o = new DataView(out.buffer);
  [h0, h1, h2, h3, h4, h5, h6, h7].forEach((v, i) => o.setUint32(i * 4, v >>> 0));
  return out;
}
function hmac256(key, msg) {
  if (key.length > 64) key = sha256(key);
  const ip = new Uint8Array(64 + msg.length), op = new Uint8Array(96);
  for (let i = 0; i < 64; i++) { const k = key[i] || 0; ip[i] = k ^ 0x36; op[i] = k ^ 0x5c; }

}
function pbkdf2Js(pass, salt, iter) {
  const s = new Uint8Array(salt.length + 4); s.set(salt); s[salt.length + 3] = 1;
  let u = hmac256(pass, s); const out = u.slice();
  for (let i = 1; i < iter; i++) { u = hmac256(pass, u); for (let j = 0; j < 32; j++) out[j] ^= u[j]; }
  return out;
}
const toHex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
const fromHex = h => { const a = new Uint8Array(h.length / 2); for (let i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; };

const Auth = {
  uid: null, fails: {},

  async hash(password, saltHex, iter = ITER) {
    const pw = new TextEncoder().encode(password), salt = fromHex(saltHex);
    if (window.crypto && crypto.subtle) {
      try {
        const key = await crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveBits']);
        return toHex(new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, key, 256)));
      } catch (e) { /* احتياط */ }
    }
    await new Promise(r => setTimeout(r, 0));
    return toHex(pbkdf2Js(pw, salt, iter));
  },
  async makeCred(password) {
    const salt = toHex(crypto.getRandomValues(new Uint8Array(16)));
    return { salt, iter: ITER, passHash: await this.hash(password, salt, ITER) };
  },
  async verify(user, password) { return (await this.hash(password, user.salt, user.iter || ITER)) === user.passHash; },

  async login(username, password) {
    const key = norm(username);
    const f = this.fails[key];
    if (f && f.until > Date.now()) return { locked: Math.ceil((f.until - Date.now()) / 1000) };
    const user = Store.list('users').find(u => u.username.toLowerCase() === String(username).trim().toLowerCase());
    let ok = false;
    if (user && user.active !== false) ok = await this.verify(user, password);
    else await this.hash(password, '00'.repeat(16)); // تساوي زمن الاستجابة
    if (!ok) {
      const n = ((f && f.n) || 0) + 1;
      this.fails[key] = { n, until: n >= 5 ? Date.now() + 30000 : 0 };
      if (n >= 5) this.fails[key].n = 0;
      return { error: true };
    }
    delete this.fails[key];
    this.uid = user.id; sessionStorage.setItem('att_uid', user.id);
    return { user };
  },
  restore() {
    const id = sessionStorage.getItem('att_uid'); const u = id && Store.get('users', id);
    this.uid = (u && u.active !== false) ? id : null;
  },
  logout() { this.uid = null; sessionStorage.removeItem('att_uid'); },

  user() { return this.uid ? Store.get('users', this.uid) : null; },
  isAdmin() { const u = this.user(); return !!u && u.role === 'admin'; },

  /* null = كل الأقسام (المسؤول) ، وإلا مصفوفة معرّفات الأقسام المسندة */
  classIds() {
    const u = this.user(); if (!u) return [];
    if (u.role === 'admin') return null;
    return (u.classIds || []).filter(id => Store.get('classes', id));
  },
  canClass(id) { const ids = this.classIds(); return ids === null || ids.includes(id); },
  classes() { const ids = this.classIds(), all = Store.sortedClasses(); return ids === null ? all : all.filter(c => ids.includes(c.id)); },
  students() { const ids = this.classIds(), all = Store.list('students'); return ids === null ? all : all.filter(s => ids.includes(s.classId)); },
  canStudent(s) { const ids = this.classIds(); return ids === null || (!!s.classId && ids.includes(s.classId)); }
};

'use strict';
/* =====================================================================
   04-formats.js — قراءة/كتابة xlsx ، قراءة جداول docx ، قراءة csv
   (مبنية على JSZip فقط، تعمل دون اتصال بالإنترنت)
   ===================================================================== */
const NS_REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const xmlDoc = async (zip, path) => { const f = zip.file(path); return f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; };
const byTag = (node, name) => Array.from(node.getElementsByTagNameNS('*', name));
const kids = (node, name) => Array.from(node.childNodes).filter(n => n.nodeType === 1 && n.localName === name);

const Xlsx = {
  async readRows(buf) {
    const zip = await JSZip.loadAsync(buf);
    let sheetPath = 'xl/worksheets/sheet1.xml';
    const wb = await xmlDoc(zip, 'xl/workbook.xml'), rels = await xmlDoc(zip, 'xl/_rels/workbook.xml.rels');
    if (wb && rels) {
      const sh = byTag(wb, 'sheet')[0];
      const rid = sh && (sh.getAttributeNS(NS_REL, 'id') || sh.getAttribute('r:id'));
      if (rid) byTag(rels, 'Relationship').forEach(r => {
        if (r.getAttribute('Id') === rid) { const tg = r.getAttribute('Target'); sheetPath = tg.startsWith('/') ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//, ''); }
      });
    }
    const sheet = await xmlDoc(zip, sheetPath);
    if (!sheet) throw new Error('invalid xlsx');
    const textOf = el => byTag(el, 't').filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join('');
    const sst = await xmlDoc(zip, 'xl/sharedStrings.xml');
    const strings = sst ? byTag(sst, 'si').map(textOf) : [];
    const colIdx = ref => { const m = /^([A-Z]+)/i.exec(ref || ''); if (!m) return -1; let n = 0; for (const ch of m[1].toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const rows = [];
    byTag(sheet, 'row').forEach(row => {
      const r = [];
      kids(row, 'c').forEach(c => {
        let idx = colIdx(c.getAttribute('r')); if (idx < 0) idx = r.length;
        const type = c.getAttribute('t'), v = kids(c, 'v')[0];
        let val = '';
        if (type === 'inlineStr') { const is = kids(c, 'is')[0]; val = is ? textOf(is) : ''; }
        else if (type === 's') val = v ? (strings[parseInt(v.textContent, 10)] || '') : '';
        else val = v ? v.textContent : '';
        r[idx] = val;
      });
      for (let i = 0; i < r.length; i++) if (r[i] === undefined) r[i] = '';
      const rn = parseInt(row.getAttribute('r'), 10);
      if (rn) while (rows.length < rn - 1) rows.push([]);
      rows.push(r);
    });
    return rows;
  },

  /* sheets: [{name, rows:[[...]], rtl?:bool, header?:bool(default true)}] */
  async write(sheets) {
    const zip = new JSZip();
    const X = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const colName = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
    const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    const MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
    const names = sheets.map((s, i) => (String(s.name || 'Sheet' + (i + 1)).replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 31)) || 'Sheet' + (i + 1));

    zip.file('[Content_Types].xml', head + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>');
    zip.file('_rels/.rels', head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
    zip.file('xl/workbook.xml', head + `<workbook xmlns="${MAIN}" xmlns:r="${NS_REL}"><sheets>` +
      names.map((n, i) => `<sheet name="${X(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>');
    zip.file('xl/_rels/workbook.xml.rels', head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
      `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
    zip.file('xl/styles.xml', head + `<styleSheet xmlns="${MAIN}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>` +
      '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF7"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color auto="1"/></left><right style="thin"><color auto="1"/></right><top style="thin"><color auto="1"/></top><bottom style="thin"><color auto="1"/></bottom><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs></styleSheet>');

    sheets.forEach((sh, i) => {
      const rows = sh.rows || [], hdr = sh.header !== false;
      const ncol = rows.reduce((m, r) => Math.max(m, r.length), 0);
      const widths = [];
      for (let c = 0; c < ncol; c++) { let w = 8; rows.forEach(r => { const v = r[c]; if (v != null) w = Math.max(w, Math.min(50, String(v).length + 3)); }); widths.push(w); }
      let xml = head + `<worksheet xmlns="${MAIN}"><sheetViews><sheetView workbookViewId="0"${sh.rtl ? ' rightToLeft="1"' : ''}>` +
        (hdr && rows.length > 1 ? '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' : '') + '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>';
      if (ncol) xml += '<cols>' + widths.map((w, c) => `<col min="${c + 1}" max="${c + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
      xml += '<sheetData>';
      rows.forEach((r, ri) => {
        xml += `<row r="${ri + 1}">`;
        r.forEach((v, ci) => {
          if (v == null || v === '') return;
          const ref = colName(ci) + (ri + 1), st = (hdr && ri === 0) ? 1 : 0;
          if (typeof v === 'number' && isFinite(v)) xml += `<c r="${ref}" s="${st}"><v>${v}</v></c>`;
          else xml += `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
        });
        xml += '</row>';
      });
      xml += '</sheetData></worksheet>';
      zip.file(`xl/worksheets/sheet${i + 1}.xml`, xml);
    });
    return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
};

const Docx = {
  /* يقرأ أكبر جدول في مستند وورد ويعيده كمصفوفة صفوف */
  async readTable(buf) {
    const zip = await JSZip.loadAsync(buf);
    const doc = await xmlDoc(zip, 'word/document.xml');
    if (!doc) throw new Error('invalid docx');
    const tables = byTag(doc, 'tbl').map(tbl => kids(tbl, 'tr').map(tr => kids(tr, 'tc').map(tc =>
      byTag(tc, 'p').map(p => byTag(p, 't').map(t => t.textContent).join('')).filter(x => x.trim() !== '').join(' ').trim())));
    if (!tables.length) return [];
    tables.sort((a, b) => b.length - a.length);
    return tables[0];
  }
};

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

    if (Math.abs(dx3) < 1e-9 && Math.abs(dy3) < 1e-9) { a = p1.x - p0.x; b = p3.x - p0.x; d = p1.y - p0.y; e = p3.y - p0.y; }
    else {
      const det = dx1 * dy2 - dx2 * dy1; if (Math.abs(det) < 1e-9) return null;
      g = (dx3 * dy2 - dx2 * dy3) / det; hh = (dx1 * dy3 - dx3 * dy1) / det;
      a = p1.x - p0.x + g * p1.x; b = p3.x - p0.x + hh * p3.x; d = p1.y - p0.y + g * p1.y; e = p3.y - p0.y + hh * p3.y;
    }
    const s = dim - 7;
    return (col, row) => { const u = (col - 3) / s, v = (row - 3) / s, den = g * u + hh * v + 1; return [(a * u + b * v + p0.x) / den, (d * u + e * v + p0.y) / den]; };
  }

  function sampleGrid(bin, w, h, map, dim, ms) {
    const g = Array.from({ length: dim }, () => new Uint8Array(dim));
    const px = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y); return (xi >= 0 && yi >= 0 && xi < w && yi < h) ? bin[yi * w + xi] : 0; };
    const e = ms * 0.22;
    for (let r = 0; r < dim; r++) for (let c = 0; c < dim; c++) {
      const p = map(c, r), x = p[0], y = p[1];
      const votes = px(x, y) + px(x + e, y) + px(x - e, y) + px(x, y + e) + px(x, y - e);
      g[r][c] = votes >= 3 ? 1 : 0;
    }
    return g;
  }

  /* إزاحات الزاوية الرابعة (بوحدات modules) مرتبة من الأقرب إلى الأبعد: 0 = متوازي أضلاع */
  const BR_OFFSETS = (() => {
    const o = []; for (let dx = -4; dx <= 4; dx += 0.5) for (let dy = -4; dy <= 4; dy += 0.5) o.push([dx, dy]);
    return o.sort((p, q) => (p[0] * p[0] + p[1] * p[1]) - (q[0] * q[0] + q[1] * q[1]));
  })();

  /* img: {data: RGBA, width, height} → {text, found} */
  function decode(img) {
    const w = img.width, h = img.height, gray = new Uint8Array(w * h), d = img.data;
    for (let i = 0, j = 0; i < gray.length; i++, j += 4) gray[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
    let found = false;
    for (const mode of ['local', 'otsu']) {
      const bin = binarize(gray, w, h, mode), cands = findFinders(bin, w, h);
      if (cands.length < 3) continue;
      const T = pickTriple(cands); if (!T) continue;
      found = true;
      const dim0 = Math.hypot(T.tr.x - T.tl.x, T.tr.y - T.tl.y) / T.ms + 7, v0 = Math.round((dim0 - 17) / 4);
      const bx = T.tr.x + T.bl.x - T.tl.x, by = T.tr.y + T.bl.y - T.tl.y;
      for (const ver of [v0, v0 - 1, v0 + 1]) {
        if (ver < 1 || ver > MAXV) continue;
        const dim = 4 * ver + 17;
        /* الزاوية الرابعة مجهولة تحت المنظور: نجرّب إزاحات صغيرة حولها، وتصحيح ريد-سولومون يحسم الصحيح */
        for (const [dx, dy] of (ver === v0 ? BR_OFFSETS : BR_OFFSETS.slice(0, 25))) {
          const map = homography(T, { x: bx + dx * T.ms, y: by + dy * T.ms }, dim); if (!map) continue;
          let text = null; try { text = readModules(sampleGrid(bin, w, h, map, dim, T.ms), ver); } catch (e) { text = null; }
          if (text) return { text, found: true };
        }
      }
    }
    return { text: null, found };
  }

  return { encode, toSVG, decode, MAXV, _rsCorrect: rsCorrect };
})();

          const g = k => $(k, ov).value.trim().replace(/\s+/g, ' ');
          const rec = { lastName: g('#f_last'), firstName: g('#f_first'), birthDate: $('#f_bdate', ov).value, birthPlace: g('#f_bplace'), classId: $('#f_class', ov).value, status: $('#f_status', ov).value };
          if (!rec.lastName || !rec.firstName) return Modal.error(ov, t('err_names_required'));
          if (rec.birthDate && !parseDate(rec.birthDate)) return Modal.error(ov, t('err_bad_date'));
          if (!admin && !rec.classId) return Modal.error(ov, t('err_class_required'));
          if (rec.classId && !Auth.canClass(rec.classId)) return Modal.error(ov, t('err_forbidden'));
          const c = rec.classId && Store.get('classes', rec.classId);
          rec.levelId = c ? c.levelId : $('#f_level', ov).value;
          const key = x => norm(x.lastName) + '|' + norm(x.firstName) + '|' + (x.birthDate || '');
          const dup = Store.list('students').some(x => x.id !== (s && s.id) && key(x) === key(rec));
          const finish = () => {
            if (s) {
              if (s.status !== rec.status) (s.history = s.history || []).push({ status: rec.status, date: todayISO() });
              Store.update('students', s.id, rec);
            } else {
              Store.add('students', Object.assign(rec, { code: Store.nextCode(), qr: Store.newQr(), history: [{ status: rec.status, date: todayISO() }], createdAt: new Date().toISOString() }));
            }
            Toast.show(t('saved'), 'success'); App.refresh();
          };
          if (dup) { Modal.confirm(t('confirm_duplicate')).then(ok => { if (ok) { finish(); Modal.close(ov); } }); return false; }
          finish();
        }
      }]
    });
    return ov;
  },

  async remove(id) {
    const s = Store.get('students', id);
    if (!s || !Auth.canStudent(s)) return Toast.show(t('err_forbidden'), 'error');
    if (!await Modal.confirm(t('confirm_delete_student', { name: s.lastName + ' ' + s.firstName }), { danger: true, okLabel: t('delete') })) return;
    Store.remove('students', id); Toast.show(t('deleted'), 'success'); App.refresh();
  },

  /* ---------- تصدير إلى إكسل ---------- */
  async exportXlsx(list, name) {
    if (!list.length) return Toast.show(t('no_students'), 'error');
    const head = ['#', t('h_last'), t('h_first'), t('h_birthdate'), t('h_birthplace'), t('level'), t('h_class'), t('h_status'), t('student_code')];
    const rows = [head].concat(this.sorted(list).map((s, i) => [i + 1, s.lastName, s.firstName, fmtDate(s.birthDate), s.birthPlace, Store.levelName(Store.levelOfStudent(s)), Store.className(s.classId), t('st_' + s.status), s.code]));
    const blob = await Xlsx.write([{ name: t('nav_students'), rows, rtl: LANG === 'ar' }]);
    downloadBlob(blob, name + '-' + fileStamp() + '.xlsx');
  }
};

/* =====================================================================
   استيراد قوائم التلاميذ من إكسل / وورد / csv
   ===================================================================== */
const IMPORT_ALIASES = (() => {
  const raw = {
    lastName: ['لقب', 'اللقب', 'nom', 'nom de famille', 'last name', 'lastname', 'surname', 'family name'],
    firstName: ['اسم', 'الاسم', 'prenom', 'prénom', 'prénoms', 'first name', 'firstname', 'given name'],
    birthDate: ['تاريخ الميلاد', 'تاريخ الازدياد', 'تاريخ ميلاد', 'date de naissance', 'date naissance', 'date of birth', 'birth date', 'birthdate', 'dob', 'naissance', 'الميلاد', 'الازدياد'],
    birthPlace: ['مكان الميلاد', 'مكان الازدياد', 'مكان ميلاد', 'lieu de naissance', 'lieu naissance', 'place of birth', 'birth place', 'birthplace', 'pob', 'lieu'],
    status: ['الحالة', 'حالة', 'statut', 'status', 'état', 'etat', 'الوضعية'],
    className: ['القسم', 'قسم', 'classe', 'class', 'section', 'الفوج'],
    levelName: ['المستوى', 'مستوى', 'niveau', 'level']
  };
  const out = {}; Object.keys(raw).forEach(k => out[k] = raw[k].map(norm)); return out;
})();
const STATUS_ALIASES = (() => {
  const raw = {
    active: ['متمدرس', 'متمدرسة', 'scolarisé', 'scolarisee', 'active', 'enrolled', 'inscrit'],
    dropped: ['منقطع', 'منقطعة', 'abandon', 'abandonné', 'dropped', 'dropout', 'désisté'],
    expelled: ['مفصول', 'مفصولة', 'exclu', 'exclue', 'renvoyé', 'expelled'],
    oriented: ['موجه', 'موجهة', 'orienté', 'orientée', 'oriented']
  };
  const out = {}; Object.keys(raw).forEach(k => out[k] = raw[k].map(norm)); return out;
})();

function fieldOfHeader(cell) {
  const n = norm(cell); if (!n) return null;
  for (const f in IMPORT_ALIASES) if (IMPORT_ALIASES[f].includes(n)) return f;
  for (const f of ['birthDate', 'birthPlace', 'lastName', 'firstName', 'status', 'className', 'levelName'])
    if (IMPORT_ALIASES[f].some(a => a.length >= 6 && n.includes(a))) return f;
  return null;
}
function parseStatus(raw) {
  const n = norm(raw); if (!n) return 'active';
  for (const k in STATUS_ALIASES) if (STATUS_ALIASES[k].some(a => n === a || n.includes(a))) return k;
  return 'active';
}

/* يحوّل مصفوفة صفوف خام إلى سجلات تلاميذ */
function mapImportRows(rows) {
  rows = rows.filter(r => r && r.some(c => String(c == null ? '' : c).trim() !== ''));
  let hIdx = -1, map = {};
  for (let i = 0; i < Math.min(rows.length, 6); i++) {
    const m = {}; let hits = 0;
    rows[i].forEach((cell, ci) => { const f = fieldOfHeader(cell); if (f && m[f] === undefined) { m[f] = ci; hits++; } });
    if (hits >= 2 && (m.lastName !== undefined || m.firstName !== undefined)) { hIdx = i; map = m; break; }
  }
  if (hIdx < 0) {
    const off = rows.length && /^\d+$/.test(String(rows[0][0]).trim()) ? 1 : 0;
    map = { lastName: off, firstName: off + 1, birthDate: off + 2, birthPlace: off + 3, status: off + 4, className: off + 5 };
  }
  const clean = v => String(v == null ? '' : v).trim().replace(/\s+/g, ' ');
  const records = rows.slice(hIdx + 1).map(r => {
    const get = f => map[f] === undefined ? '' : r[map[f]];
    const birthRaw = clean(get('birthDate'));
    return {
      lastName: clean(get('lastName')), firstName: clean(get('firstName')),
      birthRaw, birthDate: parseDate(get('birthDate')), birthPlace: clean(get('birthPlace')),
      status: parseStatus(get('status')), classRaw: clean(get('className')), levelRaw: clean(get('levelName'))
    };
  });
  return { records, hasHeader: hIdx >= 0, fields: Object.keys(map) };
}

const ImportUI = {
  open({ classId = '' } = {}) {
    const admin = Auth.isAdmin(), classes = Auth.classes();
    if (!admin && !classes.length) return Toast.show(t('no_assigned_classes'), 'error');
    let parsed = null;
    const ov = Modal.open({
      title: t('import_title'), wide: true,
      body: `<div class="form-error" hidden></div>
        <p class="muted">${t('import_hint')}</p>
        <div class="form-grid">
          <label class="fld"><span>${t('target_class')}</span><select id="impClass">${admin ? `<option value="">${t('no_class')}</option>` : ''}${classes.map(c => `<option value="${esc(c.id)}" ${c.id === classId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
          <label class="fld"><span>${t('file')} (xlsx · docx · csv)</span><input type="file" id="impFile" accept=".xlsx,.docx,.csv,.txt"></label>
        </div>
        <div class="btn-row"><button type="button" class="btn" id="impTpl">${icon('download')} ${t('download_template')}</button></div>
        <div id="impPreview"></div>`,
      onMount: ov => {
        $('#impTpl', ov).addEventListener('click', async () => {
          const blob = await Xlsx.write([{ name: t('nav_students'), rtl: LANG === 'ar', rows: [[t('h_last'), t('h_first'), t('h_birthdate'), t('h_birthplace'), t('h_status'), t('h_class')], ['—', '—', '01/01/2012', '—', t('st_active'), '1AM1']] }]);
          downloadBlob(blob, 'students-template.xlsx');
        });
        $('#impFile', ov).addEventListener('change', async e => {
          const f = e.target.files[0]; parsed = null; const box = $('#impPreview', ov); box.innerHTML = '';
          Modal.error(ov, ''); if (!f) return;
          try {
            const buf = await f.arrayBuffer(), nm = f.name.toLowerCase();
            let rows;
            if (nm.endsWith('.xlsx')) rows = await Xlsx.readRows(buf);
            else if (nm.endsWith('.docx')) rows = await Docx.readTable(buf);
            else if (nm.endsWith('.csv') || nm.endsWith('.txt')) rows = parseCSV(decodeText(buf));
            else throw new Error(t('err_unsupported_file'));
            parsed = mapImportRows(rows);
            this.preview(ov, parsed);
          } catch (err) { console.error(err); Modal.error(ov, t('err_read_file') + ' ' + (err.message || '')); }
        });
      },
      buttons: [{ label: t('cancel') }, { label: t('import_btn'), cls: 'primary', onClick: ov => this.commit(ov, parsed) }]
    });
    return ov;
  },

  keyOf: r => norm(r.lastName) + '|' + norm(r.firstName) + '|' + (r.birthDate || ''),

  analyse(records) {
    const seen = new Set(Store.list('students').map(this.keyOf));
    let valid = 0, dup = 0, bad = 0;
    records.forEach(r => {
      r._state = (!r.lastName || !r.firstName) ? 'bad' : 'ok';
      if (r._state === 'ok') { const k = this.keyOf(r); if (seen.has(k)) r._state = 'dup'; else seen.add(k); }
      if (r._state === 'ok') valid++; else if (r._state === 'dup') dup++; else bad++;
    });
    return { valid, dup, bad };
  },

  preview(ov, p) {
    const s = this.analyse(p.records);
    const badDates = p.records.filter(r => r._state === 'ok' && r.birthRaw && !r.birthDate).length;
    const sample = p.records.slice(0, 8).map(r => `<tr class="${r._state !== 'ok' ? 'row-skip' : ''}"><td>${esc(r.lastName)}</td><td>${esc(r.firstName)}</td><td>${fmtDate(r.birthDate) || esc(r.birthRaw)}</td><td>${esc(r.birthPlace)}</td><td>${esc(t('st_' + r.status))}</td><td>${esc(r.classRaw)}</td></tr>`).join('');
    $('#impPreview', ov).innerHTML = `<div class="chips">
        <span class="chip">${t('rows_read')}: <b>${p.records.length}</b></span>
        <span class="chip ok">${t('rows_valid')}: <b>${s.valid}</b></span>
        <span class="chip warn">${t('rows_dup')}: <b>${s.dup}</b></span>
        <span class="chip err">${t('rows_bad')}: <b>${s.bad}</b></span>
        ${badDates ? `<span class="chip warn">${t('rows_bad_date')}: <b>${badDates}</b></span>` : ''}</div>
      ${p.hasHeader ? '' : `<p class="muted">${t('import_no_header')}</p>`}
      <div class="table-wrap"><table class="tbl compact"><thead><tr><th>${t('h_last')}</th><th>${t('h_first')}</th><th>${t('h_birthdate')}</th><th>${t('h_birthplace')}</th><th>${t('h_status')}</th><th>${t('h_class')}</th></tr></thead><tbody>${sample}</tbody></table></div>`;
  },

  commit(ov, p) {
    if (!p) return Modal.error(ov, t('err_choose_file'));
    const admin = Auth.isAdmin(), target = $('#impClass', ov).value;
    if (!admin && !target) return Modal.error(ov, t('err_class_required'));
    if (target && !Auth.canClass(target)) return Modal.error(ov, t('err_forbidden'));
    const clsByName = {}; Auth.classes().forEach(c => clsByName[norm(c.name)] = c);
    const lvlByName = {}; Store.sortedLevels().forEach(l => { lvlByName[norm(l.name)] = l; lvlByName[norm(l.short)] = l; lvlByName[String(l.order)] = l; });
    this.analyse(p.records);
    const out = [], usedQr = new Set(Store.list('students').map(x => x.qr)); let skipped = 0;
    p.records.forEach(r => {
      if (r._state !== 'ok') { skipped++; return; }
      let cls = r.classRaw ? clsByName[norm(r.classRaw)] : null;
      if (!cls && target) cls = Store.get('classes', target);
      let levelId = cls ? cls.levelId : '';
      if (!cls && r.levelRaw && lvlByName[norm(r.levelRaw)]) levelId = lvlByName[norm(r.levelRaw)].id;
      if (!admin && !cls) { skipped++; return; }
      out.push({
        code: Store.nextCode(), qr: Store.newQr(usedQr), lastName: r.lastName, firstName: r.firstName, birthDate: r.birthDate, birthPlace: r.birthPlace,
        levelId, classId: cls ? cls.id : '', status: r.status, history: [{ status: r.status, date: todayISO() }], createdAt: new Date().toISOString()
      });
    });
    if (!out.length) return Modal.error(ov, t('err_nothing_to_import'));
    Store.addMany('students', out);
    Toast.show(t('import_done', { n: out.length, skipped }), 'success', 6000);
    App.refresh();
  }
};

const Print = {
  go(html) {
    const area = $('#printArea'); area.innerHTML = html; area.dir = LANGS[LANG].dir;
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); area.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 60);
  },
  header(title) {
    const s = Store.data.settings;
    return `<div class="ps-head">
      <div class="ps-school">${s.logo ? `<img src="${esc(s.logo)}" alt="" class="ps-logo">` : ''}<div>${s.directorate ? esc(s.directorate) + '<br>' : ''}<b>${esc(s.schoolName || t('app_name'))}</b>${s.wilaya ? '<br>' + esc(s.wilaya) : ''}</div></div>
      <div class="ps-year">${t('school_year')}: ${esc(s.year)}</div></div><h2 class="ps-title">${esc(title)}</h2>`;
  },
  classList(classId) {
    const c = Store.get('classes', classId);
    if (!c || !Auth.canClass(classId)) return Toast.show(t('err_forbidden'), 'error');
    const list = StudentsUI.sorted(Store.list('students').filter(s => s.classId === classId));
    const rows = list.map((s, i) => `<tr><td class="num">${i + 1}</td><td>${esc(s.lastName)}</td><td>${esc(s.firstName)}</td><td>${fmtDate(s.birthDate)}</td><td>${esc(s.birthPlace)}</td><td>${esc(t('st_' + s.status))}</td></tr>`).join('');
    this.go(`<div class="print-sheet">${this.header(t('class_list') + ' — ' + c.name + ' (' + Store.levelName(c.levelId) + ')')}
      <table class="ps-table"><thead><tr><th>#</th><th>${t('h_last')}</th><th>${t('h_first')}</th><th>${t('h_birthdate')}</th><th>${t('h_birthplace')}</th><th>${t('h_status')}</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="ps-foot">${t('total')}: ${list.length} · ${t('printed_on')} ${fmtDate(todayISO())}</div></div>`);
  }
};

'use strict';

const ACT = {}, INP = {}, CHG = {}, SUB = {};   // معالجات الأحداث (data-act / data-input / data-change / data-submit)
const Pages = {};
const THEMES = ['light', 'dark', 'green', 'violet'];

const UI = {
  get() { try { return Object.assign({ lang: 'ar', theme: 'light' }, JSON.parse(localStorage.getItem('att_ui') || '{}')); } catch (e) { return { lang: 'ar', theme: 'light' }; } },
  apply() { const p = this.get(); setLang(p.lang); document.documentElement.dataset.theme = THEMES.includes(p.theme) ? p.theme : 'light'; },
  set(patch) {
    try { localStorage.setItem('att_ui', JSON.stringify(Object.assign(this.get(), patch))); } catch (e) { /* وضع خاص */ }
    this.apply(); App.shell = false; App.render();
  }
};
const langOptions = () => Object.keys(LANGS).map(k => `<option value="${k}" ${k === LANG ? 'selected' : ''}>${LANGS[k].name}</option>`).join('');
const themeOptions = () => { const cur = UI.get().theme; return THEMES.map(k => `<option value="${k}" ${k === cur ? 'selected' : ''}>${esc(t('theme_' + k))}</option>`).join(''); };

Pages.dashboard = {

    const u = Auth.user(), admin = Auth.isAdmin();
    const students = Auth.students(), classes = Auth.classes();

      else if (days >= 7) alerts.push(`<div class="alert info">${icon('download')}<div>${t('alert_old_backup', { n: days })} <button class="btn sm" data-act="goto" data-href="#/settings">${t('go_settings')}</button></div></div>`);
    } else if (!classes.length) alerts.push(`<div class="alert warn">${icon('alert')}<div>${t('no_assigned_classes')}</div></div>`);

      bars = Store.sortedLevels().map(l => ({ label: l.name, n: students.filter(s => s.status === 'active' && Store.levelOfStudent(s) === l.id).length }));
    } else {
      bars = classes.map(c => ({ label: c.name, n: students.filter(s => s.status === 'active' && s.classId === c.id).length }));
    }
    const max = Math.max(1, ...bars.map(b => b.n));
    const barsHtml = bars.length ? bars.map(b => `<div class="bar-row"><span class="bar-label">${esc(b.label)}</span><div class="bar"><i style="width:${Math.round(b.n / max * 100)}%"></i></div><b>${b.n}</b></div>`).join('') : `<p class="muted">—</p>`;

    return `<div class="page-head"><h2>${t('welcome', { name: esc(u.fullName) })}</h2><div class="btn-row"><button class="btn primary" data-act="goto" data-href="#/attendance">${icon('scan')} ${t('nav_attendance')}</button><span class="badge b-role">${esc(t('role_' + u.role))}</span></div></div>
      ${alerts.join('')}
      <div class="stat-grid">
        <div class="stat"><span class="stat-ic">${icon('users')}</span><div><b>${active}</b><span>${t('stat_active')}</span></div></div>
        <div class="stat"><span class="stat-ic">${icon('grid')}</span><div><b>${classes.length}</b><span>${t('nav_classes')}</span></div></div>
        ${admin ? `<div class="stat"><span class="stat-ic">${icon('shield')}</span><div><b>${Store.list('users').filter(x => x.role === 'supervisor').length}</b><span>${t('nav_supervisors')}</span></div></div>` : ''}
        <div class="stat"><span class="stat-ic">${icon('alert')}</span><div><b>${by('dropped') + by('expelled') + by('oriented')}</b><span>${t('stat_other')}</span></div></div>
      </div>${empty}
      <div class="two-col">
        <div class="card"><h3>${admin ? t('by_level') : t('by_class')}</h3>${barsHtml}</div>
        <div class="card"><h3>${t('by_status')}</h3><div class="status-list">${STATUSES.map(k => `<div><span>${StudentsUI.badge(k)}</span><b>${by(k)}</b></div>`).join('')}</div></div>
      </div>`;
  }
};

/* ---------------- الأقسام ---------------- */
Pages.classes = {
  render() {
    const admin = Auth.isAdmin(), classes = Auth.classes();
    const head = `<div class="page-head"><h2>${t('nav_classes')}</h2>${admin ? `<div class="btn-row">
        <button class="btn primary" data-act="clAdd">${icon('plus')} <span>${t('add_class')}</span></button>
        <button class="btn" data-act="clGen">${icon('grid')} <span>${t('auto_generate')}</span></button>

    if (!classes.length) return head + `<div class="card empty">${icon('grid')}<p>${admin ? t('no_classes') : t('no_assigned_classes')}</p></div>`;
    const counts = {}; Store.list('students').forEach(s => { if (s.classId && s.status === 'active') counts[s.classId] = (counts[s.classId] || 0) + 1; });
    const blocks = Store.sortedLevels().map(l => {
      const cs = classes.filter(c => c.levelId === l.id); if (!cs.length) return '';
      return `<section class="level-block"><h3>${esc(l.name)} <small>${cs.length}</small></h3><div class="class-grid">${cs.map(c => {
        const sup = Store.supervisorsOfClass(c.id).map(x => esc(x.fullName)).join('، ');
        return `<div class="card class-card"><a class="class-name" href="#/classes/${esc(c.id)}">${esc(c.name)}</a>
          <div class="muted">${t('count_students', { n: counts[c.id] || 0 })}</div>
          ${admin ? `<div class="muted small">${icon('shield')} ${sup || '—'}</div>` : ''}
          <div class="btn-row"><a class="btn sm" href="#/classes/${esc(c.id)}">${t('open')}</a>
          ${admin ? `<button class="icon-btn" data-act="clEdit" data-id="${esc(c.id)}" aria-label="${esc(t('edit'))}">${icon('edit')}</button><button class="icon-btn danger" data-act="clDel" data-id="${esc(c.id)}" aria-label="${esc(t('delete'))}">${icon('trash')}</button>` : ''}</div></div>`;
      }).join('')}</div></section>`;
    }).join('');
    const orphans = classes.filter(c => !Store.get('levels', c.levelId));
    return head + blocks + (orphans.length ? `<section class="level-block"><h3>—</h3><div class="class-grid">${orphans.map(c => `<div class="card class-card"><a class="class-name" href="#/classes/${esc(c.id)}">${esc(c.name)}</a></div>`).join('')}</div></section>` : '');
