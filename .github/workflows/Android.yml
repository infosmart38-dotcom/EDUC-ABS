name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate Android project from index.html
        run: |
          set -e
          mkdir -p _proj && cd _proj
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AttendanceApp"
          include(":app")
          EOF_FILE
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p "$(dirname app/build.gradle)"
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'dz.attendance.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'dz.attendance.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode|layoutDirection|locale"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/dz/attendance/app/MainActivity.java)"
          cat > app/src/main/java/dz/attendance/app/MainActivity.java <<'EOF_FILE'
          package dz.attendance.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintJob;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import java.io.InputStream;
          import java.io.OutputStream;

          /**
           * يحمّل التطبيق (index.html) من assets عبر عنوان https آمن (appassets.androidplatform.net)
           * ليعمل localStorage وIndexedDB والكاميرا بشكل مستقر، ويوفّر جسرًا للحفظ والطباعة.
           */
          public class MainActivity extends Activity {
              private static final String HOST = "appassets.androidplatform.net";
              private static final String START_URL = "https://" + HOST + "/assets/index.html";
              private static final int REQ_FILE = 11, REQ_CAMERA = 12, REQ_SAVE = 13;

              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingPermission;
              private byte[] pendingBytes;
              private final Handler ui = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setSupportZoom(false);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain(HOST)
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          ui.post(new Runnable() {
                              @Override
                              public void run() {
                                  boolean wantsCamera = false;
                                  for (String r : request.getResources()) {
                                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) wantsCamera = true;
                                  }
                                  if (!wantsCamera) {
                                      request.deny();
                                      return;
                                  }
                                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                      request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                                  } else {
                                      pendingPermission = request;
                                      requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                                  }
                              }
                          });
                      }
                  });

                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(START_URL);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (code == REQ_CAMERA && pendingPermission != null) {
                      if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED)
                          pendingPermission.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                      else
                          pendingPermission.deny();
                      pendingPermission = null;
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_FILE) {
                      if (fileCallback != null) {
                          Uri[] r = WebChromeClient.FileChooserParams.parseResult(res, data);
                          fileCallback.onReceiveValue(r);
                          fileCallback = null;
                      }
                  } else if (req == REQ_SAVE) {
                      byte[] bytes = pendingBytes;
                      pendingBytes = null;
                      if (res == RESULT_OK && data != null && data.getData() != null && bytes != null) {
                          try {
                              OutputStream os = getContentResolver().openOutputStream(data.getData());
                              if (os == null) throw new Exception("no stream");
                              os.write(bytes);
                              os.close();
                              Toast.makeText(this, "تم حفظ الملف", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(this, "تعذّر حفظ الملف", Toast.LENGTH_LONG).show();
                          }
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  // يغلق النافذة المنبثقة للتطبيق إن وُجدت، وإلا يخرج إلى الشاشة الرئيسية
                  web.evaluateJavascript(
                          "(function(){try{if(typeof Modal!=='undefined'&&Modal.stack&&Modal.stack.length){Modal.close();return 1}}catch(e){}return 0})()",
                          new ValueCallback<String>() {
                              @Override
                              public void onReceiveValue(String v) {
                                  if (!"1".equals(v)) moveTaskToBack(true);
                              }
                          });
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.removeJavascriptInterface("AndroidBridge");
                      web.destroy();
                  }
                  super.onDestroy();
              }

              /** الجسر بين صفحة الويب والنظام: حفظ ملف، طباعة. */
              private class Bridge {
                  @JavascriptInterface
                  public void saveFile(final String name, final String mime, final String base64) {
                      final byte[] bytes;
                      try {
                          bytes = Base64.decode(base64, Base64.DEFAULT);
                      } catch (Exception e) {
                          return;
                      }
                      ui.post(new Runnable() {
                          @Override
                          public void run() {
                              pendingBytes = bytes;
                              Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType(mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                              i.putExtra(Intent.EXTRA_TITLE, name == null || name.isEmpty() ? "file" : name);
                              try {
                                  startActivityForResult(i, REQ_SAVE);
                              } catch (Exception e) {
                                  pendingBytes = null;
                                  Toast.makeText(MainActivity.this, "تعذّر حفظ الملف", Toast.LENGTH_LONG).show();
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void print() {
                      ui.post(new Runnable() {
                          @Override
                          public void run() {
                              PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                              if (pm == null) {
                                  fireAfterPrint();
                                  return;
                              }
                              PrintDocumentAdapter adapter = web.createPrintDocumentAdapter("attendance");
                              final PrintJob job = pm.print("attendance", adapter, new PrintAttributes.Builder().build());
                              pollJob(job, 0);
                          }
                      });
                  }
              }

              /** يراقب مهمة الطباعة ثم يُعلم الصفحة (afterprint) ليعيد التطبيق واجهته. */
              private void pollJob(final PrintJob job, final int n) {
                  ui.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          boolean done = job.isStarted() || job.isCompleted() || job.isCancelled() || job.isFailed() || n > 240;
                          if (done) {
                              // مهلة قصيرة لتكتمل كتابة المستند قبل إخفاء منطقة الطباعة
                              ui.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      fireAfterPrint();
                                  }
                              }, 1500);
                          } else {
                              pollJob(job, n + 1);
                          }
                      }
                  }, 500);
              }

              private void fireAfterPrint() {
                  web.evaluateJavascript("window.dispatchEvent(new Event('afterprint'))", null);
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/strings.xml)"
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">إدارة حضور التلاميذ</string>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/styles.xml)"
          cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#2563EB</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowBackground">#F3F5F9</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/colors.xml)"
          cat > app/src/main/res/values/colors.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#2563EB</color>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/drawable/ic_fg.xml)"
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <!-- لوح كتابة أبيض -->
              <path android:fillColor="#FFFFFF"
                  android:pathData="M34,30h40a4,4 0 0 1 4,4v44a4,4 0 0 1 -4,4h-40a4,4 0 0 1 -4,-4v-44a4,4 0 0 1 4,-4z" />
              <!-- مشبك اللوح -->
              <path android:fillColor="#1D4ED8"
                  android:pathData="M44,25h20a3,3 0 0 1 3,3v6h-26v-6a3,3 0 0 1 3,-3z" />
              <!-- علامة الحضور -->
              <path android:strokeColor="#15803D" android:strokeWidth="5" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:fillColor="#00000000"
                  android:pathData="M40,58l9,9l19,-19" />
          </vector>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml)"
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF_FILE
          mkdir -p app/src/main/assets
          cat > shim.js <<'EOF_FILE'
          /* جسر أندرويد: يُحقن في index.html عند البناء. لا يعمل خارج التطبيق. */
          (function () {
            if (!window.AndroidBridge || window.__androidShim) return;
            window.__androidShim = true;
            var B = window.AndroidBridge;
            function toB64(blob) {
              return new Promise(function (res, rej) {
                var r = new FileReader();
                r.onload = function () { res(String(r.result).split(',')[1] || ''); };
                r.onerror = rej;
                r.readAsDataURL(blob);
              });
            }
            function saveUrl(url, name) {
              return fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
                return toB64(blob).then(function (b64) {
                  B.saveFile(name || 'file', blob.type || 'application/octet-stream', b64);
                });
              });
            }
            var origClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              if (this.hasAttribute('download') && /^blob:|^data:/.test(this.href)) {
                saveUrl(this.href, this.getAttribute('download'));
                return;
              }
              return origClick.apply(this, arguments);
            };
            document.addEventListener('click', function (e) {
              var a = e.target && e.target.closest && e.target.closest('a[download]');
              if (a && /^blob:|^data:/.test(a.href)) { e.preventDefault(); saveUrl(a.href, a.getAttribute('download')); }
            }, true);
            window.print = function () { B.print(); };
          })();
          EOF_FILE
          python3 - <<'EOF_PY'
          src=open('../index.html',encoding='utf8').read()
          shim=open('shim.js',encoding='utf8').read()
          i=src.index('<head>')+len('<head>')
          open('app/src/main/assets/index.html','w',encoding='utf8').write(src[:i]+'\n<script id="androidShim">\n'+shim+'</script>'+src[i:])
          EOF_PY
      - name: Build debug APK
        working-directory: _proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-debug-apk
          path: _proj/app/build/outputs/apk/debug/*.apk
